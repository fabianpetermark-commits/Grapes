name: Publish signed Grapes TEST prerelease

# We intentionally don't use workflow_dispatch: GitHub may not discover a
# manual workflow until it exists on the default branch. An explicit change
# to the TEST-only request file in the integration branch triggers a release.
on:
  push:
    branches:
      - integration/grapes-test-food-20261017
    paths:
      - android-health-connect-poc/test-release.json

permissions:
  contents: write

concurrency:
  group: grapes-test-signed-release
  cancel-in-progress: false

jobs:
  release-test:
    if: github.ref == 'refs/heads/integration/grapes-test-food-20261017'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release request
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('fs')
          const request = JSON.parse(fs.readFileSync('android-health-connect-poc/test-release.json', 'utf8'))
          const code = request.versionCode
          const name = request.versionName
          const notes = request.notes
          if (!Number.isSafeInteger(code) || code <= 1 || code > 2000000000) throw Error('TEST versionCode must be an integer > 1')
          if (typeof name !== 'string' || !/^\d+\.\d+\.\d+$/.test(name)) throw Error('TEST versionName must be a semantic version (e.g. 0.2.0)')
          if (typeof notes !== 'string' || !notes.trim() || notes.length > 5000) throw Error('Short release notes required')
          fs.appendFileSync(process.env.GITHUB_ENV, 'GRAPES_VERSION_CODE=' + code + '\n')
          fs.appendFileSync(process.env.GITHUB_ENV, 'GRAPES_VERSION_NAME=' + name + '\n')
          fs.writeFileSync('grapes-test-release-notes.md', notes + '\n')
          NODE
      - name: Verify release tag is new and increasing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEST_TAG="android-test-v${GRAPES_VERSION_CODE}"
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            echo "::error::TEST release already exists: $TEST_TAG"
            exit 1
          fi
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | test("^android-test-v[0-9]+$")) | (.tag_name | ltrimstr("android-test-v") | tonumber)] | max // 0')"
          if [ "$GRAPES_VERSION_CODE" -le "$LATEST" ]; then
            echo "::error::TEST versionCode must increase beyond $LATEST"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:android-web
      - name: Browser regression — recipe ingredient selection
        run: node tests/android-recipe-ingredient.browser.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build APK with persistent TEST-only signing key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          TEST_KEYSTORE="$RUNNER_TEMP/grapes-test-release.p12"
          trap 'rm -f "$TEST_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$TEST_KEYSTORE"
          chmod 600 "$TEST_KEYSTORE"
          ANDROID_TEST_KEYSTORE_PATH="$TEST_KEYSTORE" \
            gradle --project-dir android-health-connect-poc :app:assembleQa
      - name: Verify APK identity and exact TEST signer certificate
        run: |
          set -euo pipefail
          SOURCE="android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk"
          TARGET="grapes-test-v${GRAPES_VERSION_CODE}.apk"
          test -s "$SOURCE"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" \
            | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" \
            | grep -F "versionCode='${GRAPES_VERSION_CODE}'"
          CERT_INFO="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SOURCE")"
          EXPECTED_CERT_SHA256="cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33"
          printf '%s\n' "$CERT_INFO" \
            | grep -Fi "Signer #1 certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}"
          mv "$SOURCE" "$TARGET"
          echo "APK_PATH=$TARGET" >> "$GITHUB_ENV"
          sha256sum "$TARGET" > "$TARGET.sha256"
      - name: Publish TEST prerelease only — never mark latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "android-test-v${GRAPES_VERSION_CODE}" "$APK_PATH" \
            --title "Grapes TEST ${GRAPES_VERSION_NAME}" \
            --notes-file grapes-test-release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-test-v${GRAPES_VERSION_CODE}" \
            --jq 'select(.prerelease == true and .draft == false and .make_latest != "true") | .tag_name' \
            | grep -Fx "android-test-v${GRAPES_VERSION_CODE}"
      - name: Attach SHA-256 checksum to TEST prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "android-test-v${GRAPES_VERSION_CODE}" "$APK_PATH.sha256" --clobber

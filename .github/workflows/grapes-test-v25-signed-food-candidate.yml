name: Grapes TEST v25 synthetic Food signed QA CANDIDATE (NO RELEASE)

on:
  push:
    branches:
      - feature/grapes-test-v25-food-synthetic-signed-candidate-20261024
    paths:
      - .github/workflows/grapes-test-v25-signed-food-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-test-v25-signed-food-candidate
  cancel-in-progress: false

jobs:
  test-sign-archive-only:
    if: github.repository == 'fabianpetermark-commits/Grapes' && github.ref == 'refs/heads/feature/grapes-test-v25-food-synthetic-signed-candidate-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRAPES_VERSION_CODE: '25'
      GRAPES_VERSION_NAME: '0.9.16'
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'true'
      VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED: 'true'
      VITE_GRAPES_TEST_SUPABASE_URL: https://aighqtqjlzirlokxwupt.supabase.co
      VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
      VITE_GRAPES_TEST_FOOD_LOCAL_CAS_ENABLED: 'false'
      VITE_GRAPES_TEST_WATER_PROFILE_ENABLED: 'false'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: '991532871119'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
    steps:
      - name: Check out exact TEST source, no write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm published signed v24 ancestry and no release actions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'android-test-v24^{commit}')" = 'f14127b72267db1c77c1751bded5027352837202'
          git merge-base --is-ancestor f14127b72267db1c77c1751bded5027352837202 HEAD
          test "$VITE_GRAPES_TEST_SUPABASE_URL" = "https://aighqtqjlzirlokxwupt.supabase.co"
          case "$VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_????????????????*) echo "Dedicated TEST publishable key configured" ;;
            *) echo "::error::Missing TEST publishable key; cannot build active data path"; exit 1 ;;
          esac
          test "$VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED" = false
          test "$VITE_GRAPES_TEST_FOOD_LOCAL_CAS_ENABLED" = false
          test "$VITE_GRAPES_TEST_WATER_PROFILE_ENABLED" = false
          test -s src/sync/grapes-test-synthetic-food-trial.js
          grep -Fq 'VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED' src/android-mobile-shell.js
          grep -Fq 'data-grapes-test-food-qa hidden' design/android-mobile-preview.html
      - name: Live TEST Data API preflight (anon must be denied; private schema not exposed)
        run: |
          set -euo pipefail
          endpoint="$VITE_GRAPES_TEST_SUPABASE_URL/rest/v1/rpc/list_profiles"
          code=$(curl --max-time 15 -sS -o "$RUNNER_TEMP/grapes-api-probe.json" -w '%{http_code}' \
            -H "apikey: $VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Profile: api" -H "Accept-Profile: api" \
            -H "Content-Type: application/json" -d '{}' "$endpoint")
          case "$code" in
            401|403|404) echo "TEST API rejects unauthenticated RPC (HTTP $code)" ;;
            406) echo "::error::api schema is not exposed in Supabase TEST Data API settings"; exit 1 ;;
            2*) echo "::error::Anonymous caller was allowed to list profiles"; exit 1 ;;
            *) echo "::error::TEST Data API preflight failed: HTTP $code"; exit 1 ;;
          esac
          if grep -q 'PGRST106' "$RUNNER_TEMP/grapes-api-probe.json"; then
            echo "::error::api schema is not in the exposed-schema list"; exit 1
          fi
          private_code=$(curl --max-time 15 -sS -o "$RUNNER_TEMP/grapes-private-probe.json" -w '%{http_code}' \
            -H "apikey: $VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept-Profile: grapes_private" "$VITE_GRAPES_TEST_SUPABASE_URL/rest/v1/")
          if [ "$private_code" != 406 ]; then
            echo "::error::Cannot prove private schema is unexposed (HTTP $private_code)"; exit 1
          fi
          echo "PASS: anonymous denied and private schema not exposed"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full unit tests and account/Drive separation
        run: |
          npm test
          node --test tests/grapes-test-native-client.test.js tests/grapes-supabase-test-gateway.test.js tests/ebook-drive-boundary.test.js
      - name: Build real QA assets with TEST-only key
        run: |
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/login-auth-test.html
          grep -R -q 'aighqtqjlzirlokxwupt' android-health-connect-poc/app/src/main/assets/assets
      - name: Install Chromium for focused browser checks
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
            browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            test -n "$browser"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          fi
      - name: Real IndexedDB synthetic trial plus Auth and E-book boundaries
        env:
          VITE_GRAPES_TEST_AUTH_ENABLED: 'false'
          VITE_GRAPES_TEST_DATA_ENABLED: 'false'
          VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED: 'false'
        run: |
          node tests/grapes-test-outbox.browser.mjs
          node tests/grapes-test-synthetic-food-trial.browser.mjs
          node tests/grapes-test-auth.browser.mjs
          node tests/android-ebook-shelf.browser.mjs
          node tests/water-durability.browser.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android native QA unit tests
        run: gradle --project-dir android-health-connect-poc :app:testQaUnitTest
      - name: Historical TEST key, version and signer verification
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-test-v25.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          SRC=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -F "versionCode='25'"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SRC")
          printf '%s\n' "$CERT" | grep -Fi "Signer #1 certificate SHA-256 digest: cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33"
          mv "$SRC" grapes-test-v25-food-synthetic-candidate.apk
          sha256sum grapes-test-v25-food-synthetic-candidate.apk > grapes-test-v25-food-synthetic-candidate.apk.sha256
          sha256sum -c grapes-test-v25-food-synthetic-candidate.apk.sha256
      - name: Archive 7-day signed QA candidate only (NO release, NO update)
        uses: actions/upload-artifact@v4
        with:
          name: grapes-test-v25-food-synthetic-signed-qa-only
          path: |
            grapes-test-v25-food-synthetic-candidate.apk
            grapes-test-v25-food-synthetic-candidate.apk.sha256
          if-no-files-found: error
          retention-days: 7

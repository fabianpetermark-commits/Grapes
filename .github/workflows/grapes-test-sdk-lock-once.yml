name: Grapes TEST one-shot SDK lockfile preparation

on:
  push:
    branches:
      - feature/grapes-auth-test-bootstrap-20261021
    paths:
      - .github/workflows/grapes-test-sdk-lock-once.yml

permissions:
  contents: write

jobs:
  lock-official-sdk:
    if: github.repository == 'fabianpetermark-commits/Grapes' && github.ref == 'refs/heads/feature/grapes-auth-test-bootstrap-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/grapes-auth-test-bootstrap-20261021
          persist-credentials: false
      - name: Setup Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate lockfile with npm metadata only, without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact @supabase/supabase-js@2.118.0
      - name: Audit exact changes before commit
        shell: bash
        run: |
          git diff --check
          test "$(node -p "require('./package.json').dependencies['@supabase/supabase-js']")" = "2.118.0"
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' package-lock.json package.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --stat
      - name: Commit only package files back to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build(auth): pin official Supabase JS 2.118.0 and lockfile'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feature/grapes-auth-test-bootstrap-20261021

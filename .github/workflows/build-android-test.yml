name: Build Grapes TEST APK (preview)

on:
  push:
    branches:
      - integration/grapes-test-food-20261017
    paths:
      - android-health-connect-poc/**
      - src/**
      - design/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - tests/android-test-channel.test.js
      - .github/workflows/release-android-test.yml
      - .github/workflows/build-android-test.yml
  pull_request:
    branches:
      - fix/food-existing-features-20261017
      - integration/grapes-test-food-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:android-web
      - name: Browser regression test (recipe ingredient search and selection)
        run: node tests/android-recipe-ingredient.browser.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build QA variant (debug-signed preview only)
        run: gradle --project-dir android-health-connect-poc :app:assembleQa
      - name: Check isolated package identity
        run: |
          APK="android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='hu.grapes.healthconnect.test'"
      - uses: actions/upload-artifact@v4
        with:
          name: grapes-test-preview-apk
          path: android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error

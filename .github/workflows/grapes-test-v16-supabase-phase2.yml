name: Grapes TEST v16 Supabase Phase 2 review (NO RELEASE)

on:
  pull_request:
    branches:
      - feature/grapes-test-food-usda-dictionary-20261021
    paths:
      - .github/workflows/grapes-test-v16-supabase-phase2.yml
      - poc/supabase-phase2/**
      - src/auth/**
      - src/login-auth-test.js
      - src/login-preview.js
      - login-auth-test.html
      - login-preview.html
      - tests/**
      - package.json
      - package-lock.json
      - vite.config.js

permissions:
  contents: read

jobs:
  local-supabase-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Confirm CLI commands and runner identity
        run: |
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase migration new --help >/dev/null
          supabase status --help >/dev/null
          echo "Tested commit: $GITHUB_SHA"
      - name: Prepare isolated local Supabase stack
        env:
          GRAPES_SUPABASE_LOCAL_DIR: ${{ runner.temp }}/grapes-supabase-${{ github.run_id }}
        run: |
          mkdir -p "$GRAPES_SUPABASE_LOCAL_DIR"
          cd "$GRAPES_SUPABASE_LOCAL_DIR"
          supabase init
          node "$GITHUB_WORKSPACE/poc/supabase-phase2/ci/prepare-config.mjs"
          supabase migration new grapes_ci_api_bootstrap
          migration=$(find supabase/migrations -name '*_grapes_ci_api_bootstrap.sql' -print -quit)
          test -n "$migration"
          printf 'create schema if not exists api;\n' > "$migration"
          supabase start
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify SQL, local Auth, RLS boundaries and independent CAS sessions
        env:
          GRAPES_SUPABASE_LOCAL_DIR: ${{ runner.temp }}/grapes-supabase-${{ github.run_id }}
        run: node poc/supabase-phase2/ci/verify-local.mjs

  complete-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean dependency install
        run: npm ci
      - name: Complete unit suite including E-book Drive boundary
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Build Android web assets without publishing
        run: npm run build:android-web
      - name: Isolated Auth unit tests
        run: node --test tests/grapes-auth-flow.test.js tests/grapes-login-controller.test.js tests/grapes-test-runtime.test.js
      - name: Find browser for local synthetic regression suite
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
            browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            test -n "$browser"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          fi
      - name: Complete local browser regression suite
        run: |
          set -e
          passed=0
          failed=0
          for file in tests/*.browser.mjs; do
            # Explicit optional live-service diagnostic; it has no CI assertion.
            if [ "$file" = tests/food-live-api.browser.mjs ]; then continue; fi
            echo "Running $file"
            # Match the existing Android TEST browser workflow's synthetic
            # channel without changing the web E-book test environment.
            if [[ "$file" == tests/android-* ]]; then
              if VITE_GRAPES_TEST_CHANNEL=1 node "$file"; then
                passed=$((passed + 1))
              else
                failed=$((failed + 1))
                echo "FAIL: $file"
              fi
              continue
            fi
            if node "$file"; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "FAIL: $file"
            fi
          done
          echo "Browser regression files: $passed PASS, $failed FAIL"
          test "$failed" -eq 0

  android-test-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'false'
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile unsigned-for-release TEST QA APK without upload
        run: |
          gradle --project-dir android-health-connect-poc :app:assembleQa
          test -s android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk

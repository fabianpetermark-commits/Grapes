name: Grapes TEST v43 native One Home CAS signed APK (NO PROD RELEASE)

on:
  push:
    branches:
      - feature/grapes-test-onehome-native-cas-v43-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-home-v43-native-signed-test
  cancel-in-progress: false

jobs:
  signed-test-apk:
    if: github.repository == 'fabianpetermark-commits/Grapes' &&
        github.ref == 'refs/heads/feature/grapes-test-onehome-native-cas-v43-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRAPES_VERSION_CODE: '43'
      GRAPES_VERSION_NAME: '0.9.43-onehome-cas-test'
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'true'
      VITE_GRAPES_TEST_HOME_FAMILY_ENABLED: 'true'
      VITE_GRAPES_TEST_SUPABASE_URL: https://aighqtqjlzirlokxwupt.supabase.co
      VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
      VITE_GRAPES_TEST_LEGACY_BACKUP_ENABLED: 'false'
      VITE_GRAPES_PROD_AUTH_ENABLED: 'false'
      VITE_GRAPES_PROD_LEGACY_DATA_ISOLATION_REVIEWED: 'false'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: '991532871119'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: QA-only source and Supabase TEST config assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_GRAPES_TEST_SUPABASE_URL" = "https://aighqtqjlzirlokxwupt.supabase.co"
          test "$VITE_GRAPES_PROD_AUTH_ENABLED" = "false"
          test "$VITE_GRAPES_TEST_HOME_FAMILY_ENABLED" = "true"
          test "$GRAPES_VERSION_CODE" = "43"
          case "$VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_????????????????*) echo 'TEST publishable key configured';;
            *) echo "::error::Missing TEST publishable key"; exit 1;;
          esac
          test -f src/home/home-one-native-test-sync.js
          test -f android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/TestSupabaseProxy.kt
          test -f android-health-connect-poc/app/src/qa/AndroidManifest.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Existing local Home / Finance / Auth + new owner/CAS unit regressions
        run: npm test
      - name: Android WebView build including TEST login and approved One Home
        run: |
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/login-auth-test.html
          test -s android-health-connect-poc/app/src/main/assets/design/android-mobile-preview.html
      - name: Isolated One Home family outbox and offline UI tests
        run: |
          node --test tests/home-m3b-family.test.js tests/home-one-test-sync.test.js tests/home-family-auto-sync.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 36 build tools
        run: |
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Native TEST JWT owner-isolation and QA unit tests
        run: gradle --project-dir android-health-connect-poc :app:testQaUnitTest
      - name: Signed TEST v43 APK – verify package, signer and SHA256
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-home-v43-test.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          src=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$src"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$src" |
            grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$src" |
            grep -F "versionCode='43'"
          cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$src")
          printf '%s\n' "$cert" |
            grep -Fi 'Signer #1 certificate SHA-256 digest: cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33'
          mv "$src" grapes-home-v43-signed-test.apk
          sha256sum grapes-home-v43-signed-test.apk > grapes-home-v43-signed-test.apk.sha256
          sha256sum -c grapes-home-v43-signed-test.apk.sha256
      - name: Archive signed TEST APK only – no PROD release
        uses: actions/upload-artifact@v4
        with:
          name: grapes-home-v43-signed-test-only
          path: |
            grapes-home-v43-signed-test.apk
            grapes-home-v43-signed-test.apk.sha256
          if-no-files-found: error
          retention-days: 7

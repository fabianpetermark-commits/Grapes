name: Android Food backup hotfix checks

on:
  pull_request:
    branches:
      - codex/android-app
    paths:
      - src/android-bridge.js
      - src/food/food-mobile.js
      - android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/MainActivity.kt
      - tests/food-backup-export.test.js
      - .github/workflows/food-backup-hotfix.yml

permissions:
  contents: read

jobs:
  web-and-native-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/food-backup-export.test.js
      - run: npm test
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile debug Android (no production APK or release)
        run: gradle --project-dir android-health-connect-poc :app:assembleDebug

name: Grapes PROD Home SQL review harness (ephemeral Postgres, NO PROD DB)

on:
  push:
    branches: [review/grapes-home-prod-migration-v35]
  pull_request:
    branches: [codex/android-app]

permissions:
  contents: read

concurrency:
  group: grapes-prod-home-sql-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ephemeral-sql-review:
    if: github.repository == 'fabianpetermark-commits/Grapes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: review-only
          POSTGRES_DB: grapes_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grapes_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: review-only
      PGDATABASE: grapes_review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create minimal Supabase Auth compatibility fixtures in ephemeral database
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.jwt() RETURNS jsonb
            LANGUAGE sql STABLE
            AS $$ SELECT coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid(), auth.jwt() TO authenticated;
          SQL
      - name: Apply the guarded proposal only to ephemeral Postgres
        env:
          PGOPTIONS: -c grapes.prod_home_review_approved=yes
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-home-review/home-m3b-prod-proposal.sql
      - name: Verify RLS, least privilege, API grants and a real authenticated RPC path
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='grapes_home_private' AND c.relkind='r' AND c.relrowsecurity;
            IF v_count <> 4 THEN RAISE EXCEPTION 'Expected RLS on all four private tables; got %',v_count; END IF;
            SELECT count(*) INTO v_count
              FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
             WHERE n.nspname='api' AND p.proname LIKE 'home_m3b_%';
            IF v_count <> 10 THEN RAISE EXCEPTION 'Expected ten API wrappers; got %',v_count; END IF;
            IF EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                       WHERE n.nspname='api' AND p.proname LIKE 'home_m3b_%' AND p.prosecdef) THEN
              RAISE EXCEPTION 'API wrappers must remain SECURITY INVOKER';
            END IF;
            IF has_schema_privilege('anon','grapes_home_private','USAGE') THEN
              RAISE EXCEPTION 'anon must not use the private Home schema';
            END IF;
            IF NOT has_schema_privilege('authenticated','grapes_home_private','USAGE') THEN
              RAISE EXCEPTION 'authenticated needs private-schema USAGE for SECURITY INVOKER wrappers; PostgREST must not expose this schema';
            END IF;
            IF has_table_privilege('authenticated','grapes_home_private.households','SELECT') THEN
              RAISE EXCEPTION 'Authenticated must not read private tables directly';
            END IF;
            IF has_function_privilege('anon','api.home_m3b_list_households()','EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute Home RPC';
            END IF;
            IF NOT has_function_privilege('authenticated','api.home_m3b_list_households()','EXECUTE') THEN
              RAISE EXCEPTION 'authenticated must execute Home API wrapper';
            END IF;
          END $$;
          INSERT INTO auth.users(id) VALUES ('11111111-1111-4111-8111-111111111111');
          SQL
          rpc_output="$(psql -v ON_ERROR_STOP=1 -At -c "SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111'; SELECT set_config('request.jwt.claims', json_build_object('sub','11111111-1111-4111-8111-111111111111','role','authenticated','is_anonymous',false)::text,false); SET ROLE authenticated; SELECT api.home_m3b_create_household('SQL review QA'); SELECT api.home_m3b_list_households(); RESET ROLE;")"
          printf '%s\n' "$rpc_output"
          echo "$rpc_output" | grep -q 'householdId'
          household_id="$(printf '%s\n' "$rpc_output" | sed -n 's/.*"householdId":"\([^"]*\)".*/\1/p' | head -1)"
          test -n "$household_id"
          invite_output="$(psql -qAt -v ON_ERROR_STOP=1 -c "SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111'; SELECT set_config('request.jwt.claims', json_build_object('sub','11111111-1111-4111-8111-111111111111','role','authenticated','is_anonymous',false)::text,false); SET ROLE authenticated; SELECT api.home_m3b_create_invite('$household_id','viewer',24)->>'inviteCode'; RESET ROLE;")"
          invite_code="$(printf '%s\n' "$invite_output" | grep -E '^[0-9a-f]{64}$' | tail -1)"
          test -n "$invite_code"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users(id) VALUES ('22222222-2222-4222-8222-222222222222');"
          viewer_output="$(psql -qAt -v ON_ERROR_STOP=1 -c "SET request.jwt.claim.sub='22222222-2222-4222-8222-222222222222'; SELECT set_config('request.jwt.claims', json_build_object('sub','22222222-2222-4222-8222-222222222222','role','authenticated','is_anonymous',false)::text,false); SET ROLE authenticated; SELECT api.home_m3b_accept_invite('$invite_code'); SELECT api.home_m3b_read_household('$household_id'); RESET ROLE;")"
          printf '%s\n' "$viewer_output" | grep -q '"role": "viewer"'
          if psql -qAt -v ON_ERROR_STOP=1 -c "SET request.jwt.claim.sub='22222222-2222-4222-8222-222222222222'; SELECT set_config('request.jwt.claims', json_build_object('sub','22222222-2222-4222-8222-222222222222','role','authenticated','is_anonymous',false)::text,false); SET ROLE authenticated; SELECT api.home_m3b_compare_and_swap('$household_id','33333333-3333-4333-8333-333333333333',0,'{}'::jsonb); RESET ROLE;" >/tmp/viewer-cas.log 2>&1; then
            echo '::error::viewer unexpectedly wrote to Home'
            exit 1
          fi
          grep -qi 'no household write permission' /tmp/viewer-cas.log
          if psql -v ON_ERROR_STOP=1 -At -c "SET ROLE anon; SELECT api.home_m3b_list_households();" >/tmp/anon-rpc.log 2>&1; then
            echo '::error::anon unexpectedly executed a Home RPC'
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -At -c "SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111'; SET ROLE authenticated; SELECT * FROM grapes_home_private.households;" >/tmp/direct-table.log 2>&1; then
            echo '::error::authenticated unexpectedly selected a private Home table directly'
            exit 1
          fi
          echo 'PASS: isolated SQL syntax, RLS/ACL checks and authenticated RPC path. No Supabase project or PROD database contacted.'

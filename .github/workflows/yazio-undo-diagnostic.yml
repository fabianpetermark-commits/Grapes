name: YAZIO undo write-order diagnostic
on:
  pull_request:
    branches: [test/browser-followup-corrections-20261020]
    paths: [.github/workflows/yazio-undo-diagnostic.yml, tests/android-food-yazio.browser.mjs]
permissions:
  contents: read
jobs:
  synthetic-yazio-undo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Find browser
        run: |
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Repeat synthetic browser assertion in independent processes
        shell: bash
        run: |
          failed=0
          for attempt in 1 2 3; do
            echo "YAZIO attempt $attempt"
            if VITE_GRAPES_TEST_CHANNEL=1 node tests/android-food-yazio.browser.mjs; then
              echo "PASS attempt $attempt"
            else
              echo "FAIL attempt $attempt"
              failed=$((failed + 1))
            fi
          done
          echo "YAZIO repeat failures: $failed"
          test "$failed" -eq 0

name: Grapes TEST single-phone A/B read-only isolation (NO RELEASE)

on:
  push:
    branches:
      - feature/grapes-test-single-phone-isolation-proof-20261024
  pull_request:
    branches:
      - feature/grapes-test-two-account-auth-isolation-20261024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-test-single-phone-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-read-only-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'false'
      VITE_GRAPES_TEST_DATA_ENABLED: 'false'
      VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED: 'false'
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify default-off, foreign read denial and local data boundaries
        run: |
          npm test
          node --test tests/grapes-test-one-phone-isolation.test.js tests/grapes-test-native-client.test.js tests/grapes-test-food-qa-panel.test.js
      - name: Build normal web and Android assets with all TEST data gates off
        run: |
          npm run build
          npm run build:android-web
      - name: Find Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
            browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            test -n "$browser"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          fi
      - name: Outbox, synthetic Food and four-button phone-width browser regressions
        run: |
          node tests/grapes-test-outbox.browser.mjs
          node tests/grapes-test-synthetic-food-trial.browser.mjs
          node tests/grapes-test-food-qa-layout.browser.mjs
          node tests/grapes-test-auth.browser.mjs

  android-qa-compile-no-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'true'
      VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED: 'true'
      VITE_GRAPES_TEST_SUPABASE_URL: https://aighqtqjlzirlokxwupt.supabase.co
      VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ci_only_000000000000
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile gated QA assets with fake public key
        run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 36
        run: |
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Native QA unit and compilation only
        run: |
          gradle --project-dir android-health-connect-poc :app:testQaUnitTest :app:assembleQa
          test -s android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          echo 'No APK artifact, signing, publication, PROD or TEST data write'

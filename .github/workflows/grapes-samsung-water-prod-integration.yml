name: Samsung Water owner isolation and licensed SDK compile (no publication)
on:
  pull_request:
    branches: [codex/android-app]
    paths:
      - 'src/water/samsung-*'
      - 'src/android-bridge.js'
      - 'src/android-mobile-shell.js'
      - 'android-health-connect-poc/**'
      - 'tests/samsung-*'
      - '.github/workflows/grapes-samsung-water-prod-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-native:
    if: github.repository == 'fabianpetermark-commits/Grapes' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:android-web
      - name: Locate Chromium
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node tests/samsung-water-prod.browser.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (do not request removed legacy tools package)
        shell: bash
        run: |
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native owner gate tests with explicit stub
        run: |
          test ! -f android-health-connect-poc/app/libs/samsung-health-data-api-1.1.0.aar
          gradle --project-dir android-health-connect-poc :app:testDebugUnitTest
      - name: Stage licensed SDK privately and verify distribution checksum
        id: sdk
        env:
          SDK_B64: ${{ secrets.SAMSUNG_HEALTH_DATA_SDK_AAR_BASE64 }}
          SDK_ZIP_URL: ${{ secrets.SAMSUNG_HEALTH_DATA_SDK_ZIP_URL }}
          SDK_AAR_URL: ${{ secrets.SAMSUNG_HEALTH_DATA_SDK_AAR_URL }}
        shell: bash
        run: |
          set -euo pipefail
          dest=android-health-connect-poc/app/libs/samsung-health-data-api-1.1.0.aar
          umask 077
          if [ -n "$SDK_B64" ]; then
            printf '%s' "$SDK_B64" | base64 --decode > "$dest"
          elif [ -n "$SDK_ZIP_URL" ]; then
            case "$SDK_ZIP_URL" in https://*) ;; *) echo '::error::SDK ZIP URL must use HTTPS'; exit 1;; esac
            zipfile="$RUNNER_TEMP/samsung-sdk-private.zip"
            trap 'rm -f "$zipfile"' EXIT
            case "$SDK_ZIP_URL" in
              https://drive.google.com/*|https://drive.usercontent.google.com/*)
                python -m pip install --disable-pip-version-check --quiet 'gdown==5.2.2'
                gdown --fuzzy --no-cookies --quiet --output "$zipfile" "$SDK_ZIP_URL" ;;
              *) curl --fail --location --silent --show-error --retry 2 --max-time 150 --proto '=https' --proto-redir '=https' "$SDK_ZIP_URL" --output "$zipfile" ;;
            esac
            printf '%s  %s\n' '7a51440d840e099769b150c6414365bc43eecb61c01fa5bf6d0e54e09c2b663f' "$zipfile" | sha256sum --check --status
            unzip -p "$zipfile" '1.1.0/libs/samsung-health-data-api-1.1.0.aar' > "$dest"
          elif [ -n "$SDK_AAR_URL" ]; then
            case "$SDK_AAR_URL" in https://*) ;; *) echo '::error::SDK AAR URL must use HTTPS'; exit 1;; esac
            curl --fail --location --silent --show-error --retry 2 --max-time 150 --proto '=https' --proto-redir '=https' "$SDK_AAR_URL" --output "$dest"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::error::BLOCKED: no licensed Samsung SDK secret (BASE64 or existing #173 ZIP/AAR URL). Stub is NOT a direct integration pass.'
            echo 'Licensed Samsung compile: BLOCKED — private AAR and ZIP/AAR URL secrets absent.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s  %s\n' 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654' "$dest" | sha256sum --check --status
          unzip -t "$dest" >/dev/null
          unzip -Z -1 "$dest" | grep -Fxq classes.jar
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Compile real licensed adapter and run native tests (no APK assembly)
        if: steps.sdk.outputs.available == 'true'
        env:
          GRAPES_REQUIRE_SAMSUNG_SDK: 'true'
        run: |
          gradle --project-dir android-health-connect-poc :app:testDebugUnitTest :app:compileReleaseKotlin
          echo 'Licensed adapter compile: PASS. Physical Samsung permission/readback still required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Public distribution remains blocked for the private developer candidate
        if: github.head_ref == 'integration/grapes-prod-v35-rc-20261027' || github.ref_name == 'integration/grapes-prod-v35-rc-20261027'
        run: echo 'Samsung PUBLIC distribution NOT approved. Private SDK compile only; developer mode and physical readback required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check Samsung-registered PROD package and signing certificate
        if: steps.sdk.outputs.available == 'true' && github.head_ref != 'integration/grapes-prod-v35-rc-20261027' && github.ref_name != 'integration/grapes-prod-v35-rc-20261027'
        env:
          REGISTERED_PACKAGE: ${{ vars.SAMSUNG_HEALTH_REGISTERED_PACKAGE }}
          REGISTERED_CERT: ${{ vars.SAMSUNG_HEALTH_REGISTERED_CERT_SHA256 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REGISTERED_PACKAGE" ] || [ -z "$REGISTERED_CERT" ] || [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo '::error::BLOCKED: Samsung PROD package/certificate registration evidence or signing credentials missing.'
            echo 'Samsung package/certificate binding: BLOCKED — registration evidence or signing credentials missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test "$REGISTERED_PACKAGE" = hu.grapes.healthconnect
          keystore="$RUNNER_TEMP/samsung-binding-check.p12"
          umask 077
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          actual=$(keytool -J-Duser.language=en -list -v -keystore "$keystore" -storetype PKCS12 -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk '/SHA256:/{print $2;exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$REGISTERED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$expected"
          echo 'Samsung configured PROD package/certificate match: PASS. Samsung approval and physical readback remain external requirements.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove licensed bytes
        if: always()
        run: rm -f android-health-connect-poc/app/libs/samsung-health-data-api-1.1.0.aar

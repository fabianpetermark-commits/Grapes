name: Grapes v1.2 UI parity – Outdoor, Tools, Health and Finance shell (NO RELEASE)

on:
  push:
    branches: [fix/grapes-v12-ui-parity-outdoor-tools-health-20261028]
  pull_request:
    branches: [codex/android-app]

permissions:
  contents: read

concurrency:
  group: grapes-v12-ui-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-ui-parity:
    if: github.repository == 'fabianpetermark-commits/Grapes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full unit and integration regression
        run: npm test
      - name: Android web assets build
        run: npm run build:android-web
      - name: Install Chromium for real browser UI tests
        run: npx playwright-core install --with-deps chromium
      - name: Main rail, live favorites, Outdoor and Tools widgets
        run: node tests/grapes-main-v12-live.browser.mjs
      - name: One Health navigation rail and Quick Action dock, real routes
        run: node tests/grapes-health-approved-live-ui.browser.mjs
      - name: Finance Android-shell route must render, not white screen
        run: node tests/finance-android-shell.browser.mjs
      - name: Finance transactions, backup and Drive regression
        run: node tests/finance-backup.browser.mjs
      - name: Approved One Home widgets and local v1 preservation
        run: node tests/prod-home-one-house.browser.mjs
      - name: Family Home preview / permissions regression
        run: node tests/home-family-preview.browser.mjs

name: Grapes TEST v17 Update (TEST ONLY)
on:
  push:
    branches:
      - feature/grapes-test-v17-native-barcode-20261022
    paths:
      - '.github/workflows/grapes-test-v17-signed-candidate.yml'
      - 'android-health-connect-poc/**'
      - 'src/food/**'
      - 'src/android-bridge.js'
permissions:
  contents: write
concurrency:
  group: grapes-test-v17-barcode-signed
  cancel-in-progress: false
jobs:
  sign-verify-and-archive:
    if: github.repository == 'fabianpetermark-commits/Grapes' && github.ref == 'refs/heads/feature/grapes-test-v17-native-barcode-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      GRAPES_VERSION_CODE: '17'
      GRAPES_VERSION_NAME: '0.9.8'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact published TEST v16 ancestor
        run: git merge-base --is-ancestor ec8e7fa08f86967afc75f495e5fc82b62a5c4a97 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit and Food regressions
        run: |
          npm test
          node tests/android-food-mobile.browser.mjs
          node tests/android-recipe-ingredient.browser.mjs
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Sign QA with historical TEST key and verify identity
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-test-v17.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          SRC=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -F "versionCode='17'"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SRC")
          EXPECTED=cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33
          printf '%s\n' "$CERT" | grep -Fi "Signer #1 certificate SHA-256 digest: $EXPECTED"
          mv "$SRC" grapes-test-v17-signed-candidate.apk
          sha256sum grapes-test-v17-signed-candidate.apk > grapes-test-v17-signed-candidate.apk.sha256
      - name: Archive 7-day APK for manual TEST, never release
        uses: actions/upload-artifact@v4
        with:
          name: grapes-test-v17-native-barcode-signed-candidate
          path: |
            grapes-test-v17-signed-candidate.apk
            grapes-test-v17-signed-candidate.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Grapes TEST v17 prerelease (never PROD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-test-v17 >/dev/null 2>&1; then
            echo "android-test-v17 already exists, refusing to overwrite an existing update"
            exit 1
          fi
          test -s grapes-test-v17-signed-candidate.apk
          test -s grapes-test-v17-signed-candidate.apk.sha256
          sha256sum -c grapes-test-v17-signed-candidate.apk.sha256
          cp grapes-test-v17-signed-candidate.apk grapes-test-v17.apk
          sha256sum grapes-test-v17.apk > grapes-test-v17.apk.sha256
          cat > "$RUNNER_TEMP/grapes-test-v17-notes.md" <<'EOF'
          Grapes TEST v17 (0.9.8-test) — a meglévő Grapes TEST v16 frissítése, nem külön alkalmazás.

          - Food: új natív élő kamerás EAN/UPC vonalkódolvasó CameraX + ML Kit használatával.
          - Grapes sötét, visszafogott neon-cián kamera felület, be-/kikapcsolható folyamatos LED-vaku és kétujjas zoom.
          - Az ellenőrzőszám és két egyező felismerés csökkenti a téves beolvasást; kézi vonalkódbevitel továbbra is elérhető.
          - A már meglévő OFF-terméklekérdezés, szerkeszthető tápértékadatok, receptek, Food/Water/Finance/E-book adatformátumok és a TEST Google Drive mappák változatlanok.
          - A korábbi TEST v16 magyar USDA és keresési javításait megtartja.
          - A teljes Health/Water/Drive ütközésvédelmi audit és az új Auth-kísérletek nincsenek ebben a kiadásban.

          A TEST APK csomagneve hu.grapes.healthconnect.test, verziókód 17, ugyanazzal a TEST aláíró tanúsítvánnyal, mint a v16.
          Telepítés előtt készíts ellenőrzött biztonsági mentést a TEST adataidról. A TEST appot ne töröld, és ne töröld az adatait. Ha a frissítést elutasítja a telefon, ne próbáld újratelepítéssel megoldani.
          A vaku, a kamerás felismerés és a felület telefonos tesztje még szükséges. A fő Grapes PROD nincs módosítva.
          EOF
          gh release create android-test-v17             grapes-test-v17.apk grapes-test-v17.apk.sha256             --target "$GITHUB_SHA"             --title "Grapes TEST 0.9.8 (v17) – Vonalkódolvasó és vaku"             --notes-file "$RUNNER_TEMP/grapes-test-v17-notes.md"             --prerelease
          gh release view android-test-v17 --json tagName,isPrerelease,assets,url

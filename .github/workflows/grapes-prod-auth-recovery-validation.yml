name: Grapes PROD Auth recovery validation (NO RELEASE)

on:
  push:
    branches:
      - fix/prod-restore-v29-google-login-20261023
  pull_request:
    branches:
      - codex/android-app

permissions:
  contents: read

jobs:
  auth-recovery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_GRAPES_PROD_AUTH_ENABLED: 'true'
      VITE_GRAPES_PROD_LEGACY_DATA_ISOLATION_REVIEWED: 'true'
      VITE_GRAPES_PROD_SUPABASE_URL: https://yopabovoxyffhokhbgxl.supabase.co
      VITE_GRAPES_PROD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZbcYVjCGzHeLmRWluW5bwQ_qJaSIGfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit and PROD Auth regression suite
        run: npm test
      - name: Existing Health, Food and meal-editor browser regressions
        run: |
          node tests/android-module-hubs.browser.mjs
          node tests/android-mobile-preview.browser.mjs
          node tests/android-recipe-ingredient.browser.mjs
      - name: Compile actual Auth-enabled Android web assets
        run: |
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/login-auth-prod.html
          test -s android-health-connect-poc/app/src/main/assets/grapes-logo.svg
          grep -Fq "Auth" android-health-connect-poc/app/src/main/assets/login-auth-prod.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile native Auth-enabled Android and test owner gate
        run: gradle --project-dir android-health-connect-poc :app:compileReleaseKotlin :app:testReleaseUnitTest
      - name: Verify PROD owner gate and prevent premature automatic release
        run: |
          set -euo pipefail
          grep -Fq 'GRAPES_PROD_AUTH_ENABLED' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/MainActivity.kt
          grep -Fq 'ownerPreferences.getString("owner-uid", null)' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/ProdAuthGate.kt
          ! grep -Fq 'putString("owner-uid"' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/ProdAuthGate.kt
          ! grep -Eq '^  push:' .github/workflows/release-android.yml
          test -s docs/GRAPES_PROD_AUTH_ROLLOUT.md
          echo "PROD Auth recovery candidate validated; no release created."

name: Grapes PROD Auth config gate (NO RELEASE)
on:
  push:
    branches:
      - feature/grapes-prod-auth-staging-20261022
  pull_request:
    branches:
      - codex/android-app

permissions:
  contents: read

jobs:
  prod-auth-config-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exactly the pinned PROD dependencies
        run: npm ci
      - name: Verify independent PROD project and data isolation guards
        run: node --test tests/grapes-prod-auth-config.test.js
      - name: Verify live PROD Google handoff and actual Android return (synthetic denial, no login)
        env:
          VITE_GRAPES_PROD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZbcYVjCGzHeLmRWluW5bwQ_qJaSIGfs
        run: node scripts/check-prod-oauth-redirect.mjs
      - name: Run complete PROD baseline unit tests
        run: npm test
      - name: Verify separately bundled PROD Auth page is buildable (no APK published)
        run: |
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/login-auth-prod.html
          test -s android-health-connect-poc/app/src/main/assets/grapes-logo.svg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 for compile-only staging validation
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile Android PROD Kotlin with Auth disabled, without release signing
        env:
          VITE_GRAPES_PROD_AUTH_ENABLED: 'false'
        run: gradle --project-dir android-health-connect-poc :app:compileReleaseKotlin
      - name: Run native owner-account isolation and PKCE OAuth regressions
        env:
          VITE_GRAPES_PROD_AUTH_ENABLED: 'false'
        run: gradle --project-dir android-health-connect-poc :app:testReleaseUnitTest
      - name: Assert this staging PR cannot accidentally release PROD or TEST
        run: |
          set -euo pipefail
          ! git diff --name-only origin/codex/android-app HEAD | grep -E '^(\.github/workflows/release-android\.yml|src/food/|src/finance|src/ebook|src/android-bridge\.js)' || {
            echo "::error::Sensitive Android/Drive/Food/Finance or signed release changed in config-only staging"; exit 1;
          }
          test -s docs/GRAPES_PROD_AUTH_ROLLOUT.md
          grep -Fq 'buildConfigField("boolean", "GRAPES_PROD_AUTH_ENABLED", "false")' android-health-connect-poc/app/build.gradle.kts
          grep -Fq 'ownerPreferences.getString("owner-uid", null)' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/ProdAuthGate.kt
          ! grep -Fq 'putString("owner-uid"' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/ProdAuthGate.kt
          ! grep -Fq 'VITE_GRAPES_PROD_AUTH_ENABLED' .github/workflows/release-android.yml
          grep -Fq 'NO-GO' docs/GRAPES_PROD_AUTH_ROLLOUT.md
          echo "Only independent Auth config staging has passed; no APK is published."

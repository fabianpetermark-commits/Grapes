name: Food YAZIO import checks
on:
  push:
    branches: [feature/food-yazio-safe-import]
  pull_request:
    paths:
      - 'src/food/**'
      - 'tests/food-*.test.js'
      - '.github/workflows/food-yazio-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

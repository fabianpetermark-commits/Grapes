name: Diagnose ebook deployer account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ebook-deployer.yml'

permissions:
  contents: read

jobs:
  account-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure clasp authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing CLASPRC_JSON secret."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Identify clasp account without exposing email or tokens
        run: |
          npm install --global @google/clasp
          ACCOUNT_JSON="$(clasp show-authorized-user --json 2>/dev/null)" || {
            echo "::error::Could not query the clasp account."
            exit 1
          }
          export ACCOUNT_JSON
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const account = JSON.parse(process.env.ACCOUNT_JSON);
          const email = String(account.email || '').trim().toLowerCase();
          if (!email) throw new Error('clasp did not return an account email');
          const fingerprint = createHash('sha256').update(email).digest('hex').slice(0, 16);
          console.log(`clasp account fingerprint: ${fingerprint}`);
          NODE

name: Release signed Grapes Android v23 Food backup hotfix

# One-shot release following the explicitly approved Food backup hotfix.
# Trigger only when this workflow file is first committed on the stable branch.
on:
  push:
    branches:
      - codex/android-app
    paths:
      - .github/workflows/release-android-v23-hotfix.yml

permissions:
  contents: write

concurrency:
  group: grapes-production-v23-hotfix
  cancel-in-progress: false

jobs:
  release-apk:
    if: github.ref == 'refs/heads/codex/android-app'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      GRAPES_VERSION_CODE: '23'
      GRAPES_VERSION_NAME: '0.15.7'
      RELEASE_NOTES: 'Ételnapló: a biztonsági mentés Android fájlmentő ablakkal készül. Csak akkor jelez sikert, ha a JSON fájl valóban mentésre került. A meglévő adatok és a többi modul változatlan.'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-app
      - name: Validate hotfix release identity and ensure tag is not taken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GRAPES_VERSION_CODE}" = "23"
          test "${GRAPES_VERSION_NAME}" = "0.15.7"
          grep -F 'saveAndroidJsonBackup' src/food/food-mobile.js
          grep -F 'beginFoodBackupExport' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/MainActivity.kt
          grep -F 'applicationId = "hu.grapes.healthconnect"' android-health-connect-poc/app/build.gradle.kts
          grep -F "GRAPES_ROOT_FOLDER = 'Grapes'" src/storage/grapes-drive.js
          test ! -f android-health-connect-poc/test-release.json
          if gh release view "android-v23" >/dev/null 2>&1; then
            echo "::error::Production android-v23 already exists"; exit 1
          fi
      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/food-backup-export.test.js
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grapes-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/grapes-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --project-dir android-health-connect-poc :app:assembleRelease
      - name: Verify and name release APK
        run: |
          SOURCE="android-health-connect-poc/app/build/outputs/apk/release/app-release.apk"
          TARGET="grapes-android-v${GRAPES_VERSION_CODE}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" \
            | grep -F "package: name='hu.grapes.healthconnect'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" \
            | grep -F "versionCode='23'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SOURCE"
          mv "$SOURCE" "$TARGET"
          echo "APK_PATH=$TARGET" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum "$TARGET" > "$TARGET.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${GRAPES_VERSION_CODE}" "$APK_PATH" \
            --title "Grapes Android ${GRAPES_VERSION_NAME}" \
            --notes "$RELEASE_NOTES" \
            --target "${RELEASE_TARGET}" \
            --latest
      - name: Attach APK SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "android-v23" "$APK_PATH.sha256" --clobber

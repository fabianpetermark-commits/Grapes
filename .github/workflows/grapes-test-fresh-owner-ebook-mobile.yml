name: Grapes TEST normal mobile E-book A-B-A (NO RELEASE)

on:
  push:
    branches:
      - feature/grapes-test-fresh-owner-ebook-mobile-20261025
  pull_request:
    branches:
      - feature/grapes-test-fresh-owner-ebook-core-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-test-fresh-owner-ebook-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ebook-mobile-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_FRESH_OWNER_MODULES_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'false'
      VITE_GRAPES_TEST_FOOD_SYNTHETIC_ENABLED: 'false'
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: All unit regression tests
        run: npm test
      - name: Build opt-in TEST Android WebView assets (no APK)
        run: npm run build:android-web
      - name: Find Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
            browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            test -n "$browser"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          fi
      - name: Normal Android mobile E-book shelf reader A-B-A without Drive
        run: node tests/grapes-test-fresh-owner-ebook-mobile.browser.mjs
      - name: E-book owner IndexedDB file and progress A-B-A
        run: node tests/grapes-test-fresh-owner-ebook.browser.mjs
      - name: Normal mobile Food screen A-B-A
        run: node tests/grapes-test-fresh-owner-food-mobile.browser.mjs
      - name: Fresh Food diary and recipes A-B-A
        run: node tests/grapes-test-fresh-owner-food.browser.mjs
      - name: Normal Finance screen A-B-A
        run: node tests/grapes-test-fresh-owner-finance.browser.mjs
      - name: Water A-B-A
        run: node tests/grapes-test-fresh-owner-water-projects.browser.mjs
      - name: Local owner and backup regressions
        run: |
          node tests/grapes-test-local-owner-store.browser.mjs
          node tests/grapes-test-legacy-unclaimed-backup.browser.mjs

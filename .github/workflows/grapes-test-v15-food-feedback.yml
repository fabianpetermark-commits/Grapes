name: Grapes TEST v15 Food UI feedback regression (NO RELEASE)

on:
  pull_request:
    branches:
      - integration/grapes-test-v15-combined-base-20261021
    paths:
      - 'src/food/**'
      - 'design/android-mobile-preview.html'
      - 'tests/android-module-hubs.browser.mjs'
      - 'tests/food-usda-online.test.js'
      - '.github/workflows/grapes-test-v15-food-feedback.yml'

permissions:
  contents: read

concurrency:
  group: grapes-test-v15-food-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-food:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Signed TEST v15 ancestry
        run: git merge-base --is-ancestor e968dc16dfb14fc4e1c7d9efba24b63795412746 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Offline and online USDA, OFF Food source mapping regressions
        run: node --test tests/food-usda-online.test.js tests/food-api.test.js tests/food-off-usda-integration.test.js
      - name: Full Food and existing E-book/Drive safety unit tests
        run: npm test
      - name: Build both web targets
        run: |
          npm run build
          npm run build:android-web
      - name: Meal detail FAB only and truthful pending Food search browser regression
        run: node tests/android-module-hubs.browser.mjs
      - name: Recipes, Home and E-book device-size preservation
        run: |
          node tests/android-recipe-ingredient.browser.mjs
          node tests/android-home-mobile.browser.mjs
          node tests/android-ebook-shelf.browser.mjs
          node tests/android-ebook-reader.browser.mjs
          node tests/responsive-layout.browser.mjs
      - name: Safe REVIEW-only package
        run: |
          test ! -e .github/workflows/grapes-test-v16-auto-publish.yml
          echo 'User-data and previous TEST entries not yet verified, NO signed APK release.'

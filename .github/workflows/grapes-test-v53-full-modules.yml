name: Grapes TEST v53 — approved v1.2 UI, Outdoor, Tools, Health and Home (SIGNED QA ONLY)

on:
  push:
    branches: [qa/grapes-test-v53-full-v12-modules-20261028]
  pull_request:
    branches: [codex/android-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-test-v53-full-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    if: github.repository == 'fabianpetermark-commits/Grapes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRAPES_VERSION_CODE: '53'
      GRAPES_VERSION_NAME: '0.9.53-approved-v12-outdoor-tools-home'
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'true'
      VITE_GRAPES_TEST_HOME_FAMILY_ENABLED: 'true'
      VITE_GRAPES_TEST_SUPABASE_URL: 'https://aighqtqjlzirlokxwupt.supabase.co'
      VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GRAPES_TEST_LEGACY_BACKUP_ENABLED: 'false'
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
      VITE_GRAPES_PROD_AUTH_ENABLED: 'false'
      VITE_GRAPES_PROD_LEGACY_DATA_ISOLATION_REVIEWED: 'false'
      VITE_GOOGLE_CLIENT_ID: '991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com'
      VITE_GOOGLE_APP_ID: '991532871119'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: 'https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec'
      VITE_FOOD_BROKER_URL: 'https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihxLK9YAU6sPZcteW8kjemOGb/exec'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify TEST-only identity and current full source
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_GRAPES_TEST_SUPABASE_URL" = "https://aighqtqjlzirlokxwupt.supabase.co"
          test "$VITE_GRAPES_TEST_AUTH_ENABLED" = true
          test "$VITE_GRAPES_TEST_DATA_ENABLED" = true
          test "$VITE_GRAPES_TEST_HOME_FAMILY_ENABLED" = true
          test "$VITE_GRAPES_PROD_AUTH_ENABLED" = false
          test "$GRAPES_VERSION_CODE" = 53
          case "$VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_????????????????*) echo 'TEST publishable key configured';;
            *) echo '::error::TEST publishable key not configured'; exit 1;;
          esac
          test -s src/outdoor/outdoor-mobile.js
          test -s src/ebook-mobile-pdf.js
          test -s src/qr-studio.js
          test -s tests/outdoor-mobile.browser.mjs
          test -s tests/home-one-family-fullchain.browser.mjs
          git merge-base --is-ancestor 20bf98d980cb69e48dcdf9388a0f55fa5dbd2828 HEAD
          echo 'PASS: current unified source included; TEST Supabase only; PROD auth off.'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: All unit and model regressions
        run: |
          npm test
          node --test tests/home-native-test-session.test.js
          node --test tests/home-family-auto-sync.test.js
          node --test tests/home-one-test-sync.test.js
      - name: Browser regressions — full approved UI and real modules
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
          node tests/home-one-family-fullchain.browser.mjs
          node tests/grapes-main-v12-live.browser.mjs
          node tests/grapes-health-approved-live-ui.browser.mjs
          node tests/prod-home-one-house.browser.mjs
          node tests/prod-finance-approved-nav.browser.mjs
          node tests/android-mobile-preview.browser.mjs
          node tests/android-module-hubs.browser.mjs
          node tests/android-ebook-finance-mobile.browser.mjs
          node tests/android-ebook-shelf.browser.mjs
          node tests/android-ebook-reader.browser.mjs
          node tests/tools-live.browser.mjs
          node tests/outdoor-mobile.browser.mjs
          node tests/finance-backup.browser.mjs
          node tests/android-recipe-ingredient.browser.mjs
          node tests/android-food-yazio.browser.mjs
          node tests/samsung-water-prod.browser.mjs
      - name: Build the exact Android WebView assets
        run: |
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/design/android-mobile-preview.html
          test -s android-health-connect-poc/app/src/main/assets/login-auth-test.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Native TEST Auth and WebView bridge unit regressions
        run: gradle --project-dir android-health-connect-poc :app:testQaUnitTest
      - name: Build signed TEST APK v53 — no release
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-test-v53.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          src=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$src"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$src" | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$AAPT" dump badging "$src" | grep -F "versionCode='53'"
          "$SIGNER" verify --print-certs "$src" | grep -Fi 'Signer #1 certificate SHA-256 digest: cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33'
          mv "$src" grapes-test-v53-full-v12-signed.apk
          sha256sum grapes-test-v53-full-v12-signed.apk > grapes-test-v53-full-v12-signed.apk.sha256
          sha256sum -c grapes-test-v53-full-v12-signed.apk.sha256
      - name: Archive signed TEST APK for phone QA only
        uses: actions/upload-artifact@v4
        with:
          name: grapes-test-v53-full-v12-signed-qa-only
          path: |
            grapes-test-v53-full-v12-signed.apk
            grapes-test-v53-full-v12-signed.apk.sha256
          if-no-files-found: error
          retention-days: 7

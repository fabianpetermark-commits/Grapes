name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-app
      - feature/food-v23
    paths:
      - android-health-connect-poc/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/build-android.yml

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle --project-dir android-health-connect-poc :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grapes-debug-apk
          path: android-health-connect-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


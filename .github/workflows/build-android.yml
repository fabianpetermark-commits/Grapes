name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-app
    paths:
      - android-health-connect-poc/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/build-android.yml

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --project-dir android-health-connect-poc :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grapes-debug-apk
          path: android-health-connect-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

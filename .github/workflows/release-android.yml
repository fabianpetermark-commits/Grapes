name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number
      version_name:
        description: User-visible version, for example 0.2.0
        required: true
        type: string
      release_notes:
        description: Short release notes shown by the in-app updater
        required: true
        type: string
      publish_release:
        description: Publish the verified APK as a GitHub Release (false uploads a private review artifact only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# Serialize releases so monotonically increasing versionCodes are not reused.
concurrency:
  group: grapes-android-prod-signed-release
  cancel-in-progress: false

jobs:
  release-apk:
    # Manual workflow dispatch only during the PROD auth recovery hold.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      # Match the previously phone-approved, PROD-signed v29 Auth candidate.
      # This is still manual-only until the owner verifies the repaired APK.
      VITE_GRAPES_PROD_AUTH_ENABLED: 'true'
      VITE_GRAPES_PROD_LEGACY_DATA_ISOLATION_REVIEWED: 'true'
      VITE_GRAPES_PROD_SUPABASE_URL: https://yopabovoxyffhokhbgxl.supabase.co
      VITE_GRAPES_PROD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZbcYVjCGzHeLmRWluW5bwQ_qJaSIGfs
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-app

      - name: Resolve next production version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODE: ${{ inputs.version_code }}
          REQUESTED_NAME: ${{ inputs.version_name }}
          REQUESTED_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          # Run against the published production release sequence, not a guessed v29.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^android-v[0-9]+$"))) | (.tag_name | ltrimstr("android-v") | tonumber)] | max // 0')
          [[ "$latest" =~ ^[0-9]+$ ]]
          code="$REQUESTED_CODE"
          [[ "$code" =~ ^[0-9]+$ ]]
          name="$REQUESTED_NAME"
          notes="$REQUESTED_NOTES"
          (( code > latest )) || { echo "ERROR: Release versionCode must exceed latest published $latest"; exit 1; }
          # Existing installed production builds must remain updatable; compare
          # the signing cert to the latest published Android release later.
          (( latest > 0 )) || { echo "ERROR: No prior signed production release for signature comparison"; exit 1; }
          [[ -n "$name" && -n "$notes" ]]
          echo "GRAPES_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "GRAPES_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION_CODE=$latest" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            echo 'RELEASE_NOTES<<GRAPES_RELEASE_NOTE_EOF'
            printf '%s\n' "$notes"
            echo 'GRAPES_RELEASE_NOTE_EOF'
          } >> "$GITHUB_ENV"
          echo "Preparing signed Android v$code, comparing with published v$latest"
      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A failure here blocks signing and publishing, even on an already
      # merged PROD branch. Use the same browser regressions that protect Food.
      - name: Assert PROD Auth configuration and previously tested ownership gate
        run: |
          node --test tests/grapes-prod-auth-config.test.js tests/grapes-prod-auth-flow.test.js tests/grapes-prod-auth-staging.test.js tests/grapes-prod-oauth-redirect.test.js
          test -s login-auth-prod.html
          grep -Fq 'GRAPES_PROD_AUTH_ENABLED' android-health-connect-poc/app/src/main/java/hu/grapes/healthconnect/MainActivity.kt
      - name: Validate data and Android UI regressions
        run: |
          npm test
          node tests/android-module-hubs.browser.mjs
          node tests/android-mobile-preview.browser.mjs
          node tests/android-recipe-ingredient.browser.mjs
      - run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grapes-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/grapes-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --project-dir android-health-connect-poc :app:assembleRelease
      - name: Verify update-compatible signed APK and release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="android-health-connect-poc/app/build/outputs/apk/release/app-release.apk"
          TARGET="grapes-android-v$GRAPES_VERSION_CODE.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --print-certs "$SOURCE"
          info=$("$TOOLS/aapt" dump badging "$SOURCE")
          package_line=$(printf '%s\n' "$info" | grep -m 1 '^package:')
          [[ "$package_line" == *"name='hu.grapes.healthconnect'"* ]]
          [[ "$package_line" == *"versionCode='$GRAPES_VERSION_CODE'"* ]]
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "android-v$PREVIOUS_VERSION_CODE" \
            --pattern "grapes-android-v$PREVIOUS_VERSION_CODE.apk" \
            --dir "$RUNNER_TEMP/previous-release"
          previous="$RUNNER_TEMP/previous-release/grapes-android-v$PREVIOUS_VERSION_CODE.apk"
          test -s "$previous"
          "$TOOLS/apksigner" verify --print-certs "$previous"
          old_cert=$("$TOOLS/apksigner" verify --print-certs "$previous" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')
          new_cert=$("$TOOLS/apksigner" verify --print-certs "$SOURCE" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')
          [[ -n "$old_cert" && -n "$new_cert" && "$old_cert" == "$new_cert" ]] \
            || { echo "ERROR: Signing certificate mismatch; cannot update installed Grapes safely"; exit 1; }
          mv "$SOURCE" "$TARGET"
          apk_sha=$(sha256sum "$TARGET" | awk '{print $1}')
          printf '%s  %s\n' "$apk_sha" "$TARGET" > "$TARGET.sha256"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'package=hu.grapes.healthconnect\n'
            printf 'version_code=%s\n' "$GRAPES_VERSION_CODE"
            printf 'version_name=%s\n' "$GRAPES_VERSION_NAME"
            printf 'previous_version_code=%s\n' "$PREVIOUS_VERSION_CODE"
            printf 'signer_sha256=%s\n' "$new_cert"
            printf 'apk_sha256=%s\n' "$apk_sha"
          } > "$TARGET.manifest.txt"
          cat "$TARGET.manifest.txt"
          echo "APK_PATH=$TARGET" >> "$GITHUB_ENV"
      - name: Upload verified PROD APK for inspection without publishing
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: grapes-prod-signed-candidate-${{ github.run_id }}
          path: |
            grapes-android-v*.apk
            grapes-android-v*.apk.sha256
            grapes-android-v*.apk.manifest.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish update to Grapes app updater
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/branches/codex/android-app" --jq '.commit.sha')
            [[ "$current" == "$RELEASE_TARGET" ]] || { echo "ERROR: PROD changed; refusing to publish stale APK"; exit 1; }
          fi
          gh release create "android-v$GRAPES_VERSION_CODE" "$APK_PATH" \
            --title "Grapes Android $GRAPES_VERSION_NAME" \
            --notes "$RELEASE_NOTES" \
            --target "$RELEASE_TARGET" \
            --latest

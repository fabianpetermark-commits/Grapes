name: Grapes Home family fullchain QA (NO RELEASE)
on:
  push:
    branches: [release/grapes-ui-audit-and-home-switch-fixes-20261028]
  pull_request:
    branches: [codex/android-app]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-fullchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  family-fullchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Locate runner Chromium
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Unit regressions
        id: unit
        run: npm test
      - name: Android web compilation only (no APK)
        if: ${{ !cancelled() }}
        run: npm run build:android-web
      - name: Current approved v1.2 main navigation and favorites
        if: ${{ !cancelled() }}
        run: node tests/grapes-main-v12-live.browser.mjs
      - name: Current Home widgets and quick actions
        if: ${{ !cancelled() }}
        run: node tests/android-home-mobile.browser.mjs
      - name: Current Tools live module
        if: ${{ !cancelled() }}
        run: node tests/tools-live.browser.mjs
      - name: Current Outdoor plants and care workflows
        if: ${{ !cancelled() }}
        run: node tests/outdoor-mobile.browser.mjs
      - name: Current Finance Android-shell route and entry
        if: ${{ !cancelled() }}
        run: node tests/finance-android-shell.browser.mjs
      - name: Current Finance complete backup/export/import and restore
        if: ${{ !cancelled() }}
        run: node tests/finance-backup.browser.mjs
      - name: Current Health approved live-controller UX
        if: ${{ !cancelled() }}
        run: node tests/grapes-health-approved-live-ui.browser.mjs
      - name: Current module hubs and single navigation
        if: ${{ !cancelled() }}
        run: node tests/android-module-hubs.browser.mjs
      - name: Existing mobile preview integration
        if: ${{ !cancelled() }}
        run: node tests/android-mobile-preview.browser.mjs
      - name: Existing PROD One Home
        if: ${{ !cancelled() }}
        run: node tests/prod-home-one-house.browser.mjs
      - name: Existing outbox status
        if: ${{ !cancelled() }}
        run: node tests/home-one-outbox-status.browser.mjs
      - name: Existing family preview
        if: ${{ !cancelled() }}
        run: node tests/home-family-preview.browser.mjs
      - name: Existing durable outbox
        if: ${{ !cancelled() }}
        run: node tests/home-m3b-family-outbox.browser.mjs
      - name: Original UI → auto-sync → TEST sync → real IndexedDB → gateway → mocked authenticated RPC
        if: ${{ !cancelled() }}
        run: node tests/home-one-family-fullchain.browser.mjs
      - name: Preserve results and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: home-family-fullchain-evidence
          path: qa-results/home-family-fullchain/
          if-no-files-found: warn

      - name: Preserve responsive UI screenshots for visual audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grapes-ui-visual-audit
          path: |
            mobile-*.png
            artifacts/**/*.png
          if-no-files-found: warn

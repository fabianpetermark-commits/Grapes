name: Food cleanup and regressions

on:
  push:
    branches:
      - fix/food-existing-features-20261017
  pull_request:
    branches:
      - feature/food-off-region-settings
    paths:
      - 'src/food/**'
      - 'src/android-mobile-shell.js'
      - 'apps-script/ebook-transfer/Code.gs'
      - 'tests/**'
      - '.github/workflows/food-cleanup-ci.yml'

permissions:
  contents: read

jobs:
  food-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:android-web

name: Auto-publish verified Grapes TEST v15 only

on:
  push:
    branches:
      - release/grapes-test-v15-auto-20261021
    paths:
      - '.github/workflows/grapes-test-v15-auto-publish.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: grapes-test-v15-auto-publish-once
  cancel-in-progress: false

jobs:
  verify-sign-and-publish-test-only:
    if: github.repository == 'fabianpetermark-commits/Grapes' && github.ref == 'refs/heads/release/grapes-test-v15-auto-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRAPES_VERSION_CODE: '15'
      GRAPES_VERSION_NAME: '0.9.6'
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: 991532871119
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove release is exactly CI-reviewed v15 code plus release policy/workflow
        run: |
          set -euo pipefail
          SOURCE=e968dc16dfb14fc4e1c7d9efba24b63795412746
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort > "$RUNNER_TEMP/actual-v15-changes"
          printf '%s\n' '.github/workflows/grapes-test-v15-auto-publish.yml' 'docs/GRAPES_TEST_AUTOMATIC_RELEASE_POLICY.md' > "$RUNNER_TEMP/allowed-v15-changes"
          diff -u "$RUNNER_TEMP/allowed-v15-changes" "$RUNNER_TEMP/actual-v15-changes"
      - name: Enforce exact green Health, Food search and YAZIO checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN in 39564979284 39564979295 39564979339; do
            ACTUAL=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN" --jq '.head_sha')
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN" --jq '.status + ":" + .conclusion')
            test "$ACTUAL" = "e968dc16dfb14fc4e1c7d9efba24b63795412746"
            test "$STATE" = "completed:success"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "android-v28"
          if gh release view android-test-v15 >/dev/null 2>&1; then
            echo "::error::TEST v15 exists; refusing to overwrite an issued APK."
            exit 1
          fi
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.tag_name | test("^android-test-v[0-9]+$")) | (.tag_name | ltrimstr("android-test-v") | tonumber)] | max // 0')
          test "$LATEST" = "14"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Deterministic install, unit and Health/OFF/USDA/YAZIO regressions
        run: |
          npm ci
          npm test
          node --test tests/food-api.test.js tests/food-off-usda-integration.test.js tests/food-usda-online.test.js tests/food-search-method.test.js tests/food-catalog-search.test.js
      - name: Create exact native TEST-channel web assets
        run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36 and signing tools
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build signed QA APK with existing separate TEST signing identity
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-test-v15.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          APK=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/grapes-test-v15"
          cp "$APK" "$RUNNER_TEMP/grapes-test-v15/grapes-test-v15.apk"
      - name: Verify exact TEST package, version increment, APK signature and checksum
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/grapes-test-v15/grapes-test-v15.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='15'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.9.6-test'"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          EXPECTED=cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33
          printf '%s\n' "$CERT" | grep -Fi "Signer #1 certificate SHA-256 digest: ${EXPECTED}"
          cd "$RUNNER_TEMP/grapes-test-v15"
          sha256sum grapes-test-v15.apk > grapes-test-v15.apk.sha256
          sha256sum --check grapes-test-v15.apk.sha256
      - name: Write release notes with user-data safety and excluded work
        run: |
          cat > "$RUNNER_TEMP/grapes-test-v15/notes.md" <<'EOF'
          Grapes TEST v15 — Health keresés / nyelvi rétegek / OFF+USDA / Statisztika, a v14-es TEST alapra építve.

          - Ország szerinti Open Food Facts ételkeresés, magyar/angol névkezelés, márkák, pontosabb találatszám és keresés újraindítása régióváltáskor.
          - Natív Android országparaméter és OFF-találatok ellenőrzése; a vonalkódkeresés változatlanul globális.
          - A hiányzó tápérték továbbra is ismeretlen, nem kitalált 0. Valódi kJ->kcal konverzió és só/nátrium feldolgozás.
          - USDA Foundation/SR Legacy részleges tápérték és különböző szabályos nutrient struktúrák kezelése.
          - Health → Statisztika megnyitása Food-felvillanás nélkül.
          - Teljes CI: Food/YAZIO/Health/web/E-book/Home/Android QA fordítás sikeres; a Google Drive TEST mappák elkülönítése megmaradt.

          Nem része ennek a kiadásnak a teljes Health adatbiztonsági audit (#59–#73), a Supabase Auth és az Outdoor modul. A teljes Health release továbbra is NO-GO.

          Telepítés előtt mentsd el a helyi TEST Food/Víz/Finance/E-book adatokat. Az APK az eredeti Grapes TEST tanúsítvánnyal aláírt `hu.grapes.healthconnect.test` csomag 15-ös verziója; a régi, debug-aláírt előnézetek nem mindig frissíthetők helyben. Ha az Android visszautasítja a frissítést, NE töröld az alkalmazást biztonsági mentés nélkül.
          EOF
      - name: Publish TEST v15 prerelease automatically once, never PROD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/grapes-test-v15"
          gh release create android-test-v15 grapes-test-v15.apk grapes-test-v15.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Grapes TEST 0.9.6 (v15) – Health keresés' \
            --notes-file notes.md \
            --target e968dc16dfb14fc4e1c7d9efba24b63795412746 \
            --prerelease
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-test-v15" --jq 'select(.tag_name == "android-test-v15" and .prerelease and (.assets | length) == 2) | .tag_name' | grep -Fx 'android-test-v15'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = 'android-v28'
          echo 'Verified signed Grapes TEST v15 published, PROD latest unchanged.'

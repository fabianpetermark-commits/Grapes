name: Grapes TEST v24 FAST single-logo splash hotfix (TEST ONLY)
on:
  push:
    branches:
      - feature/grapes-test-v16-android-auth-107-20261022
    paths:
      - '.github/workflows/grapes-test-v24-quick-splash.yml'

permissions:
  contents: write

concurrency:
  group: grapes-test-v24-quick-splash-signed
  cancel-in-progress: true

jobs:
  verify-sign-and-publish-test-only:
    if: github.repository == 'fabianpetermark-commits/Grapes' && github.ref == 'refs/heads/feature/grapes-test-v16-android-auth-107-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_SUPABASE_URL: https://aighqtqjlzirlokxwupt.supabase.co
      VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
      VITE_GOOGLE_CLIENT_ID: 991532871119-mtf4k74hk1ehrm4p05n2e8hhkr582o7v.apps.googleusercontent.com
      VITE_GOOGLE_APP_ID: '991532871119'
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VITE_EBOOK_EPUB_WRITE_ENABLED: 'true'
      VITE_EBOOK_TRANSFER_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      VITE_FOOD_BROKER_URL: https://script.google.com/a/*/macros/s/AKfycbxWJ8WQUlHOYl7zI9mvfW9ec-Zal4ihDqUWBD-gxASnhxLK9YAU6sPZcteW8kjemOGb/exec
      GRAPES_VERSION_CODE: '24'
      GRAPES_VERSION_NAME: '0.9.15'
    steps:
      - name: Check out exact TEST source (never main or PROD)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed TEST v23 baseline and tiny QA-only diff (no PROD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'android-test-v23^{commit}')" = '32c475329fdd77224a8028d5332cec0e01a3b652'
          git merge-base --is-ancestor 32c475329fdd77224a8028d5332cec0e01a3b652 HEAD
          if gh release view android-test-v24 >/dev/null 2>&1; then
            echo "::error::TEST v24 exists; never overwrite or alter installed TEST release"; exit 1
          fi
          case "$VITE_GRAPES_TEST_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_????????????????*) echo "TEST public key present";;
            *) echo "::error::Missing approved TEST public key"; exit 1;;
          esac
          test "$VITE_GRAPES_TEST_SUPABASE_URL" = https://aighqtqjlzirlokxwupt.supabase.co
          test "$VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED" = false
          unexpected=$(git diff --name-only android-test-v23 HEAD -- |
            grep -Ev '^login-auth-test\.html$|^tests/grapes-test-startup-ux\.test\.js$|^android-health-connect-poc/app/src/qa/AndroidManifest\.xml$|^android-health-connect-poc/app/src/qa/res/values/styles\.xml$|^android-health-connect-poc/app/src/qa/res/values-v31/styles\.xml$|^android-health-connect-poc/app/src/qa/res/drawable/grapes_qa_transparent_splash\.xml$|^\.github/workflows/grapes-test-v24-quick-splash\.yml$' || true)
          test -z "$unexpected" || { echo "::error::Unexpected PROD / data / module changes: $unexpected"; exit 1; }
          grep -Fq 'src="./grapes-logo.svg"' login-auth-test.html
          ! grep -Fq '<p>Fiók ellenőrzése…</p>' login-auth-test.html
          ! grep -Fq '<strong>Grapes</strong>' login-auth-test.html
          grep -Fq 'GrapesQaLaunchTheme' android-health-connect-poc/app/src/qa/AndroidManifest.xml
          grep -Fq '@drawable/grapes_qa_transparent_splash' android-health-connect-poc/app/src/qa/res/values-v31/styles.xml
          grep -Fq '@android:color/transparent' android-health-connect-poc/app/src/qa/res/drawable/grapes_qa_transparent_splash.xml
          test -s public/grapes-logo.svg
          echo "Only QA Android splash + sign-in loader changed from signed v23"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean lockfile install
        run: npm ci
      - name: Quick but complete local unit tests, Auth/Drive boundaries
        run: |
          set -euo pipefail
          npm test
          node --test tests/grapes-test-startup-ux.test.js tests/grapes-android-oauth.test.js tests/grapes-auth-flow.test.js tests/grapes-test-runtime.test.js tests/ebook-drive-boundary.test.js
      - name: Build Android QA web assets with real TEST-only Auth
        run: |
          set -euo pipefail
          npm run build:android-web
          test -s android-health-connect-poc/app/src/main/assets/login-auth-test.html
          test -s android-health-connect-poc/app/src/main/assets/grapes-logo.svg
          grep -Fq 'src="./grapes-logo.svg"' android-health-connect-poc/app/src/main/assets/login-auth-test.html
          ! grep -Fq '<p>Fiók ellenőrzése…</p>' android-health-connect-poc/app/src/main/assets/login-auth-test.html
          grep -R -q 'aighqtqjlzirlokxwupt' android-health-connect-poc/app/src/main/assets/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Native callback QA Robolectric tests
        run: gradle --project-dir android-health-connect-poc :app:testQaUnitTest
      - name: Build signed TEST QA v24 with historical TEST key only
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          test -n "$ANDROID_TEST_KEYSTORE_PASSWORD"
          test -n "$ANDROID_TEST_KEY_ALIAS"
          test -n "$ANDROID_TEST_KEY_PASSWORD"
          export ANDROID_TEST_KEYSTORE_PATH="$RUNNER_TEMP/grapes-test-v24.p12"
          trap 'rm -f "$ANDROID_TEST_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
          chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          gradle --project-dir android-health-connect-poc :app:assembleQa
          SOURCE=android-health-connect-poc/app/build/outputs/apk/qa/app-qa.apk
          test -s "$SOURCE"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" | grep -F "package: name='hu.grapes.healthconnect.test'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" | grep -F "versionCode='24'"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SOURCE")
          EXPECTED=cc9dc997fa4bff3845884afd2f011efe939c02806f91393a1ddb0455b6a2ff33
          printf '%s\n' "$CERT" | grep -Fi "Signer #1 certificate SHA-256 digest: $EXPECTED"
          mv "$SOURCE" grapes-test-v24.apk
          sha256sum grapes-test-v24.apk > grapes-test-v24.apk.sha256
      - name: Preserve signed TEST v24 APK and checksum for manual installation
        uses: actions/upload-artifact@v4
        with:
          name: grapes-test-v24-single-logo-signed-qa
          path: |
            grapes-test-v24.apk
            grapes-test-v24.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish TEST v24 prerelease via existing updater (never PROD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-test-v24 >/dev/null 2>&1; then
            echo "::error::TEST v24 already exists, no overwrite"
            exit 1
          fi
          sha256sum -c grapes-test-v24.apk.sha256
          cat > "$RUNNER_TEMP/grapes-test-v24-notes.md" <<'EOF'
          Grapes TEST v24 (0.9.15-test) — gyors, célzott indulási javítás az aláírt v23-ra.

          - Csak egy Grapes logós átmenet marad: mentett TEST-fiók esetén a hitelesítés idején kizárólag a középre igazított, eredeti Grapes-logó jelenik meg.
          - A betöltőn nincs Grapes felirat és nincs „Fiók ellenőrzése…” szöveg.
          - Android 12+ alatt a külön rendszerindító képernyő nem rajzol egy második Grapes-logót; maga a rendszer indítása megmarad.
          - Kijelentkezett fióknál a szokásos bejelentkezési oldal jelenik meg; Supabase-auth biztonság és Google Drive belépés változatlan.
          - Food, YAZIO, Water, Finance, E-book, vonalkódolvasó, helyi adatok és PROD változatlanok.

          Azonos TEST csomagnév és aláírás. Meglévő TEST v23-ra telepítendő, alkalmazást vagy adatot ne törölj. Ez továbbra is TEST, nem PROD.
          A kiadás célzott egység-, Auth/Drive-, Android native, csomagnév-, aláírás- és checksum-ellenőrzésekkel készült; a teljes hosszú böngészős regresszió a csak QA splash/UI változtatások miatt ebben a gyors kiadásban NEM FUTOTT.
          EOF
          gh release create android-test-v24 grapes-test-v24.apk grapes-test-v24.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Grapes TEST 0.9.15 (v24) – Egyetlen logó, felirat nélkül' \
            --notes-file "$RUNNER_TEMP/grapes-test-v24-notes.md" \
            --prerelease
          gh release view android-test-v24 --json tagName,isPrerelease,assets,url

name: Grapes TEST native local-owner QA integration (NO APK)

on:
  push:
    branches:
      - feature/grapes-test-native-owner-qa-20261025
  pull_request:
    branches:
      - feature/grapes-test-local-owner-scoped-store-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapes-test-native-owner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_GRAPES_TEST_CHANNEL: '1'
      VITE_GRAPES_TEST_AUTH_ENABLED: 'true'
      VITE_GRAPES_TEST_LOCAL_OWNER_QA_ENABLED: 'true'
      VITE_GRAPES_TEST_DATA_ENABLED: 'false'
      VITE_GRAPES_TEST_HEALTH_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Opt-in TEST build
        run: npm run build
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
            browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            test -n "$browser"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          fi
      - name: Mocked native A-B-A session and owner-scoped Finance
        run: node tests/grapes-test-native-owner-qa.browser.mjs
      - name: Storage foundation regression
        run: node tests/grapes-test-local-owner-store.browser.mjs
      - name: Confirm baseline legacy exposure remains documented
        run: node tests/grapes-local-account-legacy-audit.browser.mjs

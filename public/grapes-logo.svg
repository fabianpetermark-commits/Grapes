        <ellipse cx="21.3" cy="57" rx="2.3" ry="1.3" /><ellipse cx="45.3" cy="57" rx="2.3" ry="1.3" /><ellipse cx="69.3" cy="57" rx="2.3" ry="1.3" />
        <ellipse cx="33.3" cy="71" rx="2.3" ry="1.3" /><ellipse cx="57.3" cy="71" rx="2.3" ry="1.3" /><ellipse cx="45.5" cy="83.5" rx="2.2" ry="1.25" />

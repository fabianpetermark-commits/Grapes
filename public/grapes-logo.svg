      <path d="M48 18c-6-6-16-4-16 4 6 4 12 2 16-4z" fill="#24dce9" stroke="#9bfbff" stroke-width=".6" />
      <g fill="#005d8e" transform="translate(0 2.8)">
        <circle cx="48" cy="32" r="8" /><circle cx="36" cy="46" r="9" /><circle cx="60" cy="46" r="9" />
        <circle cx="24" cy="60" r="9" /><circle cx="48" cy="60" r="9" /><circle cx="72" cy="60" r="9" />
        <circle cx="36" cy="74" r="9" /><circle cx="60" cy="74" r="9" /><circle cx="48" cy="86" r="8" />
      </g>
      <g fill="url(#grape-surface)" stroke="#9cfcff" stroke-opacity=".55" stroke-width=".7" filter="url(#berry-glow)">
        <circle cx="48" cy="32" r="8" /><circle cx="36" cy="46" r="9" /><circle cx="60" cy="46" r="9" />
        <circle cx="24" cy="60" r="9" /><circle cx="48" cy="60" r="9" /><circle cx="72" cy="60" r="9" />
        <circle cx="36" cy="74" r="9" /><circle cx="60" cy="74" r="9" /><circle cx="48" cy="86" r="8" />
      </g>

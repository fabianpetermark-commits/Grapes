<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="logo-bg" x1="12" y1="8" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d3040" />
      <stop offset="0.55" stop-color="#0b151e" />
      <stop offset="1" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="grape-surface" x1="28" y1="24" x2="68" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5fbff" />
      <stop offset="0.2" stop-color="#49edfa" />
      <stop offset="0.58" stop-color="#00b8e1" />
      <stop offset="1" stop-color="#00699f" />
    </linearGradient>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65" />
    </filter>
    <filter id="berry-glow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#003e68" flood-opacity=".85" />
    </filter>
    <g id="grape-cluster">

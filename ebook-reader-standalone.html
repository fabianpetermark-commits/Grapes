<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Önálló E-book olvasó</title>
  <style>
    body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif;font-size:18px;line-height:1.45}
    .wrap{max-width:620px;margin:0 auto;padding:24px 18px}
    h1{font-size:28px;margin:0 0 10px}.muted{color:#555}.card{border:1px solid #888;padding:20px;margin-top:24px}
    label{display:block;font-weight:bold;margin-bottom:8px}input{box-sizing:border-box;width:100%;font:inherit;font-size:28px;letter-spacing:.14em;text-transform:uppercase;padding:12px;border:1px solid #555}
    button{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:13px;border:1px solid #111;background:#111;color:#fff;font:inherit;font-weight:bold}
    button:disabled{opacity:.45}.small{font-size:14px;margin-top:22px}#reader-status{font-size:14px;color:#8a2525}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Önálló E-book olvasó</h1>
    <p class="muted">Könnyített oldal e-book olvasókhoz. Az első párosítás után ez a böngésző megjegyzi az olvasót.</p>
    <p id="reader-status" role="status" aria-live="polite"></p>
    <section class="card">
      <form id="pair-form" method="get">
        <input type="hidden" name="action" value="pair-reader">
        <label for="code">6 karakteres párosítási kód</label>
        <input id="code" name="code" type="text" maxlength="6" autocomplete="one-time-code" pattern="[A-Fa-f0-9]{6}" required>
        <button id="pair-submit" type="submit">Párosítás és könyvtár megnyitása</button>
      </form>
    </section>
    <p class="small">A kódot az önálló E-book könyvtár E-olvasó párosítása funkciójával kérd. A könyvek melletti küldési kód nem használható erre.</p>
  </main>
  <script type="module" src="./src/ebook-reader-standalone.js"></script>
</body>
</html>

<span aria-hidden="true" class="recipe-next">›</span>
</button></template><script>(() => {
'use strict';
const $ = selector => document.querySelector(selector), $$ = selector => [...document.querySelectorAll(selector)];
const icon = (id, kind='ic') => `<svg class="${kind}" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
const healthIcon = id => `<svg class="icon" aria-hidden="true"><use href="#ic-${id}"></use></svg>`;
const tabs = [ ['start','Kezdő','fav'], ['home','Home','home'], ['health','Health','health'], ['utility','Utility','tool'], ['finance','Finance','finance'] ];
const catalog = [
 ['food','Food','Health','food'], ['water','Víz','Health','drop'], ['recipe','Receptek','Health','book'],
 ['plants','Növények','Home','leaf'], ['tasks','Kerti teendők','Home','leaf'], ['shopping','Bevásárlás','Home','list'],
 ['books','E-book','Utility','book'], ['qr','QR eszköz','Utility','tool'], ['money','Pénzügyek','Finance','finance'] ];
const load = (key, fallback) => { try { let v=JSON.parse(localStorage.getItem('grapes-ui-demo-v13-'+key));return v??fallback; } catch {return fallback;} };
const save=(key,value)=>{try{localStorage.setItem('grapes-ui-demo-v13-'+key,JSON.stringify(value))}catch{}};
let active='start', pinned=load('pinned',['food','water']), counts=load('usage',{}), muted=load('muted',[]), water=load('water',1250);
let toastTimeout;
function toast(message){let el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.hidden=true,2800)}
function use(id){counts[id]=(counts[id]||0)+1;save('usage',counts)}
function openModal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#popover').hidden=false;$('#close-dialog').focus();}
function closeModal(){$('#popover').hidden=true;}
$('#close-dialog').addEventListener('click',closeModal);$('#done-dialog').addEventListener('click',closeModal);
$('#popover').addEventListener('click',e=>{if(e.target.id==='popover')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function rail(){ $('#rail').innerHTML=tabs.map(([id,label,ic])=>`<button type="button" role="tab" aria-selected="${id===active}" aria-controls="page-content" data-tab="${id}">${icon(ic)}<span>${label}</span></button>`).join(''); }
function title(){let label=tabs.find(x=>x[0]===active)?.[1]||'Grapes';$('#page-title').textContent=active==='start'?'Grapes':label;$('#settings-open').setAttribute('aria-label',active==='start'?'Grapes beállítások':`${label} beállításai`)}
function widgetFood(){return document.getElementById('template-food').innerHTML;}
function widgetWater(){return document.getElementById('template-water').innerHTML;}
function widgetRecipe(){return document.getElementById('template-recipe').innerHTML;}
function widgetPlants(){return `<section class="neon-edge widget-plant"><div class="widget__heading"><div class="heading-icon">${icon('leaf')}</div><h3>Növényeim</h3><button class="wide-link" data-shortcut="plants">Összes →</button></div><div class="plant-grid"><button class="plant-mini" data-shortcut="plants" type="button"><span class="plant-art">🌶️</span><strong>Csilipaprika</strong><small>Terasz · mintapéldány</small></button><button class="plant-mini" data-shortcut="plants" type="button"><span class="plant-art">🌿</span><strong>Bazsalikom</strong><small>Konyha · mintapéldány</small></button></div></section>`}
function widgetTasks(){return `<section class="neon-edge widget-simple"><div class="widget__heading"><div class="heading-icon">${icon('leaf')}</div><h3>Aktuális teendők</h3></div><div class="strip-list"><button class="strip-item" data-shortcut="tasks">${icon('drop')}<strong>Öntözés áttekintése</strong><small>›</small></button><button class="strip-item" data-shortcut="tasks">${icon('spark')}<strong>Szezonális teendők</strong><small>›</small></button></div><p class="demo-note">A tényleges feladatok később a saját növényekből készülnek.</p></section>`}
function widgetShopping(){return `<section class="neon-edge widget-simple"><div class="widget__heading"><div class="heading-icon">${icon('list')}</div><h3>Bevásárlólista</h3><button class="wide-link" data-shortcut="shopping">Megnyitás →</button></div><div class="strip-list"><button class="strip-item" data-shortcut="shopping">${icon('check')}<strong>Közös családi bevásárlólista</strong><small>›</small></button></div></section>`}
function widgetBooks(){return `<section class="neon-edge widget-simple"><div class="widget__heading"><div class="heading-icon">${icon('book')}</div><h3>E-book</h3></div><div class="widget-row"><span class="widget-icon-square">${icon('book')}</span><div class="widget-row-content"><strong>Saját könyvtár</strong><small>Olvasás, könyvek, könyvjelzők</small></div><button class="wide-link" data-shortcut="books">Megnyitás →</button></div></section>`}
function widgetQR(){return `<section class="neon-edge widget-simple"><div class="widget__heading"><div class="heading-icon">${icon('tool')}</div><h3>QR eszközök</h3></div><div class="strip-list"><button class="strip-item" data-shortcut="qr">${icon('tool')}<strong>QR-kód és beolvasás</strong><small>›</small></button></div></section>`}
function widgetMoney(){return `<section class="neon-edge widget-simple"><div class="widget__heading"><div class="heading-icon">${icon('finance')}</div><h3>Pénzügyek</h3><button class="wide-link" data-shortcut="money">Részletek →</button></div><div class="stats-pair"><div class="stats-cell"><small>Havi kiadás</small><b>—</b><small>Csak minta, nincs adatkapcsolat</small></div><div class="stats-cell"><small>Havi bevétel</small><b>—</b><small>Csak minta, nincs adatkapcsolat</small></div></div></section>`}
const renderers={food:widgetFood,water:widgetWater,recipe:widgetRecipe,plants:widgetPlants,tasks:widgetTasks,shopping:widgetShopping,books:widgetBooks,qr:widgetQR,money:widgetMoney};
function automatic(){const filtered=catalog.filter(([id])=>!pinned.includes(id)&&!muted.includes(id));const used=filtered.filter(([id])=>(counts[id]||0)>0).sort((a,b)=>(counts[b[0]]||0)-(counts[a[0]]||0));return used.length?used.slice(0,3).map(x=>x[0]):['plants'].filter(id=>!pinned.includes(id)&&!muted.includes(id));}
function renderStart(){const ids=[...pinned,...automatic().filter(id=>!pinned.includes(id))];return `<div class="section-head"><h2>Gyakran használt</h2><button class="small-add" id="add-widget" type="button">${icon('plus')} Hozzáadás</button></div>${ids.length?ids.map(id=>renderers[id]()).join(''):'<section class="neon-edge widget-simple"><h3>Még nincsenek widgetjeid</h3><p class="simple-text">Adj hozzá egyet a Hozzáadás gombbal.</p></section>'}<p class="demo-note">A kezdőlap a rögzített és a gyakran használt widgeteket együtt mutatja. A megnyitásokat ez az előnézet helyileg számolja.</p>`}
function renderContent(){ const lists={home:['plants','tasks','shopping'],health:['food','water','recipe'],utility:['books','qr'],finance:['money']};if(active==='start')return renderStart();return lists[active].map(id=>renderers[id]()).join(''); }
function actionItem(kind,label){const names={photo:'camera',food:'food',water:'drop',plant:'leaf',watering:'drop',shopping:'list',book:'book',search:'search',income:'plus',expense:'finance',report:'list',manage:'pin',add:'plus',qr:'tool',scan:'scan'};return `<button type="button" data-quick="${kind}" aria-label="${label}">${names[kind]==='scan'?healthIcon('scan'):names[kind]==='camera'?healthIcon('camera'):icon(names[kind]||'plus')}<span>${label}</span></button>`}
function renderDock(){let cfg={start:[[['add','Hozzáadás'],['manage','Kedvencek']],['search','Keresés']],home:[[['plant','Új növény'],['watering','Öntözés'],['shopping','Lista']],null],health:[[['photo','Fotó'],['food','Étel'],['water','Víz']],['scan','Vonalkód']],utility:[[['book','Könyv'],['qr','QR-kód'],['search','Keresés']],null],finance:[[['expense','Kiadás'],['income','Bevétel'],['report','Kimutatás']],null]};const [items,primary]=cfg[active];$('#dock').innerHTML=`<div class="action-dock__pill">${items.map(x=>actionItem(...x)).join('')}</div>${primary?`<button class="action-dock__primary" type="button" data-quick="${primary[0]}" aria-label="${primary[1]}">${primary[0]==='scan'?healthIcon('scan'):icon(primary[0]==='search'?'search':'plus')}</button>`:''}`;$('#dock').setAttribute('aria-label',`${tabs.find(x=>x[0]===active)[1]} – kontextuális gyorsműveletek`)}
function refreshNumbers(){let ring=$('#ring-progress');if(ring)ring.style.strokeDasharray='67.6 100';['protein-progress','carb-progress','fat-progress'].forEach((id,i)=>{const el=$('#'+id);if(el)el.style.width=[65,67,70][i]+'%'});const t=$('#water-total');if(t)t.textContent=new Intl.NumberFormat('hu-HU').format(water);const p=$('#water-progress');if(p)p.style.width=(Math.min(100,water/2200*100))+'%';const d=$('#water-description');if(d)d.textContent=water>=2200?'A bemutató napi cél teljesült.':`Még ${new Intl.NumberFormat('hu-HU').format(2200-water)} ml hiányzik a napi célhoz.`;}
function render(){rail();title();$('#page-content').innerHTML=renderContent();renderDock();refreshNumbers();}
function switchTo(id){if(active!==id){active=id;render();$('#page-content').scrollTop=0; const tab=document.querySelector(`[data-tab="${id}"]`);tab?.scrollIntoView({block:'nearest',inline:'nearest'});} }
$('#rail').addEventListener('click',e=>{let btn=e.target.closest('[data-tab]');if(btn)switchTo(btn.dataset.tab)});
function chooseShortcut(id){use(id);const item=catalog.find(x=>x[0]===id);if(!item)return;toast(`${item[1]} – ebben az előnézetben a widget és a menü működése látható.`);}
function openFavoriteModal(){openModal('Kezdőlap widgetjei',`<p>Válaszd ki, mi jelenjen meg mindig a Kezdő oldalon. A Grapes a rendszeresen megnyitott további widgeteket külön ajánlja.</p><input type="search" placeholder="Widget keresése…" id="widget-search" aria-label="Widget keresése"><div id="widget-choices">${catalog.map(([id,name,cat,ic])=>`<label data-choice="${name.toLowerCase()}"><span>${icon(ic)} ${name} <small style="color:#8ea4b4">· ${cat}</small></span><input type="checkbox" data-pin="${id}" ${pinned.includes(id)?'checked':''}></label>`).join('')}</div><div class="dialog-actions"><button type="button" id="reset-usage">Gyakoriság nullázása</button></div>`)}
$('#settings-open').addEventListener('click',()=>{let n=tabs.find(x=>x[0]===active)?.[1]||'Grapes';openModal(`${active==='start'?'Grapes':n} beállításai`,`<p>${active==='health'?'A Health céljai, mértékegységei, widgetmegjelenítése és integrációi tartoznak ide.':active==='start'?'Itt kezelhetők a főmenü, kedvencek és értesítések beállításai.':`A ${n} terület saját beállításai kerülnek ide.`}</p><div class="strip-list"><div class="strip-item">${icon('check')}<strong>Widgetek megjelenítése</strong></div><div class="strip-item">${icon('gear')}<strong>Értesítések és opciók</strong></div></div><p>Ez dizájntervezet; semmilyen meglévő Grapes beállítást nem módosít.</p>`)});
$('#page-content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='add-widget'){openFavoriteModal();return;}
if(b.id==='water-add'){water+=250;save('water',water);refreshNumbers();toast('+250 ml a bemutató víznaplóban.');use('water');return;}
if(b.dataset.shortcut){chooseShortcut(b.dataset.shortcut);return;}
if(b.dataset.meal){toast(`${b.dataset.meal}: részletek – bemutató adat.`);use('food');return;}
if(b.dataset.action){const act=b.dataset.action;use(act==='water-log'?'water':act==='recipe'?'recipe':'food');toast('Bemutató funkció – a valódi Grapes adatai nem módosulnak.');return;}
if(b.id==='calorie-ring'){use('food');toast('Food Statisztika – bemutató');return;}});
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-quick]');if(!b)return;const k=b.dataset.quick;if(k==='add'||k==='manage'){openFavoriteModal();return;}if(k==='water'){water+=250;save('water',water);refreshNumbers();use('water');toast('+250 ml hozzáadva a demo víznaplóhoz.');return;}if(k==='plant'){use('plants');toast('Új növény hozzáadása – tervezett Home művelet.');return;}if(k==='shopping')use('shopping');else if(['photo','food','scan'].includes(k))use('food');else if(['book','qr','expense','income','report'].includes(k))use(k==='book'?'books':k==='qr'?'qr':'money');toast(`${b.getAttribute('aria-label')} – interaktív mintaművelet.`)});
$('#dialog-body').addEventListener('input',e=>{if(e.target.id==='widget-search'){const q=e.target.value.toLocaleLowerCase('hu-HU');$$('[data-choice]').forEach(row=>row.hidden=!row.dataset.choice.includes(q));}});
$('#dialog-body').addEventListener('change',e=>{if(e.target.dataset.pin){let id=e.target.dataset.pin;if(e.target.checked){if(!pinned.includes(id))pinned.push(id);muted=muted.filter(x=>x!==id)}else pinned=pinned.filter(x=>x!==id);save('pinned',pinned);save('muted',muted);if(active==='start')render();toast('Kezdőlap widgetjei frissítve.')}});
$('#dialog-body').addEventListener('click',e=>{if(e.target.id==='reset-usage'){counts={};save('usage',counts);if(active==='start')render();toast('A demonstrációs használatszámláló nullázva.')}});
render();
})();</script></body></html>

<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090e14"><title>Grapes – Főmenü v1.2 · ikonsor és gyakran használt modulok</title><style>
:root{color-scheme:dark;--bg:#090e14;--surface:#101821;--raised:#17222e;--line:#243343;--text:#f2f7fb;--muted:#94a5b8;--cyan:#3bdcf2;--soft:#77c6d2;--border:#293e4c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080c12;color:var(--text)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}button,svg{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}[hidden]{display:none!important}
.defs{position:absolute;width:0;height:0;overflow:hidden}.ic{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;background:#080c12}
.phone{width:min(100%,430px);min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 16px 60px #0008}
.appbar{display:flex;align-items:center;justify-content:space-between;background:#0b131c;border-bottom:1px solid #243745;padding:18px 20px 17px;min-height:90px;flex:none;gap:12px}.appbar h1{font-size:25px;line-height:1;margin:0;font-weight:800;letter-spacing:-.04em}.settings{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;border:1px solid #34596a;background:#12222d;color:var(--cyan)}.settings .ic{width:24px;height:24px}
/* Main-menu icons are the navigation. This rail is not a secondary bottom bar. */
.main-rail{display:flex;gap:8px;align-items:stretch;padding:15px 14px 14px;flex:none;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;border-bottom:1px solid #1d2c38;background:#0d151e}.main-rail::-webkit-scrollbar{display:none}
.rail-item{width:65px;min-width:65px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:15px;background:transparent;color:#9ab0bd;scroll-snap-align:start;position:relative}
.rail-item .ic{width:27px;height:27px}.rail-item span{font-size:10.8px;font-weight:630;white-space:nowrap}.rail-item[aria-current="page"]{color:var(--cyan);border-color:#345969;background:#152934}.rail-item[aria-current="page"]::after{content:"";position:absolute;bottom:-1px;left:17px;right:17px;height:1px;background:var(--cyan);box-shadow:0 0 5px #3bdcf25c}.rail-item:not([aria-current="page"]):active{background:#142431}
/* Signature edge, no body glow. */
.neon-edge{position:relative;isolation:isolate;background:var(--surface);border:1px solid var(--border);border-radius:19px;overflow:hidden}.neon-edge:before{content:"";pointer-events:none;position:absolute;top:-1px;left:17px;width:45%;height:1px;background:linear-gradient(90deg,rgba(59,220,242,.87),rgba(59,220,242,.35) 53%,transparent);box-shadow:0 0 4px rgba(59,220,242,.22)}.neon-edge:after{content:"";pointer-events:none;position:absolute;top:19px;left:-1px;width:1px;height:52px;background:linear-gradient(180deg,rgba(59,220,242,.42),transparent);box-shadow:0 0 3px rgba(59,220,242,.2)}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:23px 17px 44px;overscroll-behavior-y:contain;scrollbar-color:#34515e transparent;scrollbar-width:thin}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 15px}.section-title h2{margin:0;font-size:20px;letter-spacing:-.035em;line-height:1.2}.section-title p{font-size:12px;color:var(--muted);margin:6px 0 0}.ghost-add{display:inline-flex;align-items:center;gap:6px;min-height:43px;padding:0 11px;border:1px solid #315665;background:#132732;border-radius:12px;color:var(--cyan);font-weight:750;font-size:12px;white-space:nowrap}.ghost-add svg{width:17px;height:17px}
.favorites-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.favorite-card{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:13px;min-width:0;min-height:164px;padding:16px 14px 14px;text-align:left;transition:border-color .16s}.favorite-card:active{border-color:#498491}.card-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:7px}.card-icon{display:grid;place-items:center;width:44px;height:44px;color:var(--soft);border:1px solid #355565;border-radius:13px;background:#172b35}.card-icon svg{width:24px;height:24px}.favorite-card h3{margin:0;font-size:17px;font-weight:770;letter-spacing:-.027em;line-height:1.2}.favorite-card p{margin:5px 0 0;font-size:11px;line-height:1.5;color:var(--muted)}.auto-label{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:#91b4bf;margin-bottom:1px;white-space:nowrap}.auto-label svg{height:12px;width:12px;color:var(--soft)}
.fav-menu{width:34px;height:34px;flex:none;border:0;background:transparent;color:#a2bbca;border-radius:10px;font-size:20px;line-height:1;display:grid;place-items:center}.fav-menu:hover{background:#20313e}.fav-menu .ic{width:17px;height:17px}
.hintline{display:flex;gap:9px;align-items:flex-start;margin:15px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.hintline .ic{width:16px;height:16px;flex:none;color:#8ac2cc;margin-top:1px}
.overview{margin-top:23px}.mini-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.mini-head h2{font-size:15px;margin:0}.mini-head small{color:var(--muted);font-size:11px}.shortcut-list{display:grid;gap:9px}.shortcut{min-height:72px;padding:13px 15px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}.shortcut .card-icon{width:40px;height:40px}.shortcut .card-icon svg{width:22px;height:22px}.shortcut strong{display:block;font-size:13px}.shortcut small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.shortcut .arrow{margin-left:auto;color:var(--cyan)}
.module-header{margin-bottom:16px}.module-header h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 5px}.module-header p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.module-panel{padding:17px;margin-bottom:12px}.module-panel h3{font-size:16px;margin:0 0 5px}.module-panel p{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.5}.module-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.module-link{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;min-height:101px;padding:13px 12px;border-radius:13px;border:1px solid #2e4858;background:#162833}.module-link .ic{color:var(--soft);width:23px;height:23px}.module-link strong{font-size:13px;line-height:1.24}.module-link small{font-size:10px;color:var(--muted);line-height:1.3}
.footnote{font-size:11px;color:#78909f;line-height:1.55;margin:19px 0 0}.footer-spacer{min-height:30px}
/* Bottom sheet for managing pinned + automatic favorites. */
.overlay{position:fixed;z-index:8;inset:0;display:flex;justify-content:center;align-items:flex-end;background:#000b;padding:0 0 env(safe-area-inset-bottom)}.sheet{background:#101d27;width:min(100%,430px);border:1px solid #386070;border-bottom:none;border-radius:24px 24px 0 0;padding:16px 16px 26px;max-height:min(83dvh,760px);overflow-y:auto;box-shadow:0 -12px 60px #0007}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.sheet-head h2{font-size:20px;margin:0}.close{width:44px;height:44px;border:1px solid #345563;background:#1a303b;border-radius:13px;display:grid;place-items:center}.close .ic{width:19px;height:19px}.sheet p{color:var(--muted);font-size:12px;line-height:1.5}.field{display:flex;align-items:center;gap:9px;border:1px solid #335362;border-radius:13px;padding:0 12px;background:#0e1922}.field .ic{width:18px;height:18px;color:#729eac}.field input{color:var(--text);width:100%;background:transparent;border:0;outline:0;font-size:14px;min-height:48px}.choices{display:grid;gap:8px;margin-top:12px}.choice{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:62px;background:#172936;border:1px solid #355261;border-radius:14px;padding:9px 12px}.choice .ic{color:#7bcbd8;width:22px;height:22px;flex:none}.choice div{flex:1;min-width:0}.choice strong{font-size:13px;display:block}.choice small{color:var(--muted);font-size:10px;display:block;margin-top:3px}.choice .state{font-size:11px;color:var(--cyan);font-weight:750;white-space:nowrap}.sheet-hint{font-size:11px!important;margin:14px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(17px,env(safe-area-inset-bottom));background:#19313d;border:1px solid #3a6471;border-radius:13px;padding:12px 16px;color:#d6f1f4;font-size:12px;z-index:12;box-shadow:0 8px 25px #0009;max-width:min(90%,390px);pointer-events:none;text-align:center}
@media(min-width:650px){.stage{padding:30px 0}.phone{min-height:830px;height:830px;border:1px solid #37515f;border-radius:24px}.overlay{align-items:center;padding:15px}.sheet{border-radius:23px;border-bottom:1px solid #386070;max-height:80dvh}}
@media(max-width:365px){.appbar{padding:14px 15px;min-height:77px}.main{padding:19px 13px 34px}.main-rail{padding-left:9px;padding-right:9px;gap:5px}.rail-item{min-width:61px;width:61px}.favorite-card{padding:13px 12px;min-height:157px}.favorite-card h3{font-size:15px}.section-title h2{font-size:18px}.ghost-add{padding:0 8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

.card-open{align-self:stretch;display:flex;justify-content:space-between;align-items:center;min-height:30px;text-align:left;padding:0;color:var(--cyan);background:none;border:0;font-weight:740;font-size:11px}.card-open span{font-size:20px;line-height:1}.favorite-card{gap:9px}
</style></head><body>
<svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H3zM8 21v-7h8v7"/></symbol><symbol id="i-health" viewBox="0 0 24 24"><path d="M20 8c0 6-8 11-8 11S4 14 4 8c0-5 6-6 8-2 2-4 8-3 8 2zM6.5 12H10l2-3 2.5 6 1.5-3h2"/></symbol><symbol id="i-tool" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol><symbol id="i-finance" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 16h3M15 14v4M18 12v6"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><path d="M10 3h4l.7 2.2 1.8 1 2.3-.7 2 3.5-1.7 1.8v2l1.7 1.8-2 3.5-2.3-.7-1.8 1L14 21h-4l-.7-2.2-1.8-1-2.3.7-2-3.5 1.7-1.8v-2L3.2 9l2-3.5 2.3.7 1.8-1z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4c-9 0-14 4-14 11 0 3 2 5 5 5 7 0 10-7 9-16zM5 21c4-8 7-10 12-13"/></symbol><symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></symbol><symbol id="i-food" viewBox="0 0 24 24"><path d="M6 3v5a3 3 0 0 0 6 0V3M9 3v18M17 3v18M17 3c3 2 3 6 3 8h-3"/></symbol><symbol id="i-projects" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/><rect x="13" y="14" width="8" height="7" rx="1"/></symbol><symbol id="i-sync" viewBox="0 0 24 24"><path d="M19 8a8 8 0 0 0-14-2L3 8m0-4v4h4M5 16a8 8 0 0 0 14 2l2-2m0 4v-4h-4"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-fav" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3z"/><path d="m12 8 1.25 2.55 2.83.41-2.04 1.99.48 2.81L12 14.44l-2.52 1.32.48-2.81-2.04-1.99 2.83-.41z"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5c3-1 6-.5 8 1v15c-2-1.5-5-2-8-1zM20 5c-3-1-6-.5-8 1v15c2-1.5 5-2 8-1z"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13"/><path d="M3 5h1M3 12h1M3 19h1"/></symbol><symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5zM3 7v10l9 5 9-5V7M12 12v10"/></symbol><symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 6 0-1 6 3 3v2H7v-2l3-3zM12 14v7"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.2 6.7 7.3 1-5.3 5.1 1.25 7.2L12 18.6 5.55 22l1.25-7.2-5.3-5.1 7.3-1z"/></symbol></svg>
<div class="stage"><div class="phone"><header class="appbar"><h1>Grapes</h1><button class="settings" type="button" id="settings" aria-label="Grapes beállítások"> <svg class="ic"><use href="#i-gear"></use></svg></button></header><nav class="main-rail" id="rail" aria-label="Grapes főmodulok"></nav><main class="main" id="main" aria-live="polite"></main><div class="footer-spacer" hidden></div></div></div>
<div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">Kedvencek kezelése</h2><button type="button" class="close" id="close-sheet" aria-label="Bezárás"><svg class="ic"><use href="#i-x"></use></svg></button></div><p>Rögzítsd a fontos modulokat. Amelyeket gyakran használsz, azok maguktól is megjelennek a kezdőoldalon.</p><label class="field"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" id="search" placeholder="Modul keresése…" autocomplete="off" aria-label="Modul keresése"></label><div class="choices" id="choices"></div><p class="sheet-hint">Ez a próba helyileg tárolja a választásokat. A valódi Grapes-ben a profilhoz kötött beállítás része lesz.</p></section></div>
<div class="toast" id="toast" role="status" hidden></div><script>(()=>{
'use strict';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const modules=[
{id:'plants',name:'Növények',category:'Home',desc:'Növények és gondozás',icon:'leaf'},
{id:'shopping',name:'Bevásárlólista',category:'Home',desc:'Bevásárlás',icon:'list'},
{id:'inventory',name:'Készletkezelő',category:'Home',desc:'Otthoni készlet',icon:'cube'},
{id:'food',name:'Ételnapló',category:'Health',desc:'Ételek, tápértékek',icon:'food'},
{id:'water',name:'Víznapló',category:'Health',desc:'Napi folyadék',icon:'drop'},
{id:'recipes',name:'Receptek',category:'Health',desc:'Saját receptek',icon:'book'},
{id:'stats',name:'Statisztika',category:'Health',desc:'Összesítések',icon:'health'},
{id:'ebooks',name:'E-book',category:'Utility',desc:'Könyvtár',icon:'book'},
{id:'qr',name:'QR',category:'Utility',desc:'QR eszközök',icon:'tool'},
{id:'finance',name:'Pénzügyi napló',category:'Finance',desc:'Bevételek és kiadások',icon:'finance'},
{id:'reports',name:'Kimutatások',category:'Finance',desc:'Elemzés',icon:'finance'}];
const rootMenus=[{id:'favorites',name:'Kezdő',icon:'fav'},{id:'home',name:'Home',icon:'home'},{id:'health',name:'Health',icon:'health'},{id:'utility',name:'Utility',icon:'tool'},{id:'finance',name:'Finance',icon:'finance'}];
const icon = n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
// Demo preferences only. Real Grapes version will need user-profile-scoped storage and verified activity metrics.
const KEY='grapes-main-v12-preview-state';
function makeInitial(){return {pinned:['food','water'],usage:{food:8,water:7,plants:5,recipes:3,shopping:1,inventory:0},hidden:[]}}
let state;try{const val=JSON.parse(localStorage.getItem(KEY)||'null');state=val?.pinned&&val?.usage&&val?.hidden?val:makeInitial()}catch{state=makeInitial()}
let active='favorites';let sheetOpen=false;let sheetPreviousFocus=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function mostUsed(){return modules.filter(m=>!state.pinned.includes(m.id)&&!state.hidden.includes(m.id)&&(state.usage[m.id]||0)>=3).sort((a,b)=>(state.usage[b.id]||0)-(state.usage[a.id]||0)).slice(0,4)}
function favorites(){return [...state.pinned.map(id=>modules.find(m=>m.id===id)).filter(Boolean),...mostUsed()]}
function renderRail(){const bar=$('#rail');bar.innerHTML=rootMenus.map(m=>`<button type="button" class="rail-item" data-view="${m.id}" ${active===m.id?'aria-current="page"':''} aria-label="${m.name==='Kezdő'?'Gyakran használt – kezdőoldal':m.name}">${icon(m.icon)}<span>${m.name}</span></button>`).join('');bar.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.view)));}
function openView(v){active=v;renderRail();renderPage();$('#main').scrollTop=0;}
function card(m){const pin=state.pinned.includes(m.id);return `<article class="favorite-card neon-edge" aria-label="${m.name}, ${pin?'rögzített':'automatikus kedvenc'}"><div class="card-top"><span class="card-icon">${icon(m.icon)}</span><button class="fav-menu" type="button" data-manage="${m.id}" aria-label="${m.name} kezelése">${icon('pin')}</button></div><div><${pin?'span':'span'} class="auto-label">${pin?icon('pin')+'Rögzítve':icon('spark')+'Automatikus'}</span><h3>${m.name}</h3><p>${m.desc}</p></div><button class="card-open" data-open="${m.id}" type="button" aria-label="${m.name} megnyitása">Megnyitás <span aria-hidden="true">›</span></button></article>`}
function renderFavorites(){const fav=favorites();$('#main').innerHTML=`<div class="section-title"><div><h2>Gyakran használt</h2><p>A fontos modulok egy helyen.</p></div><button class="ghost-add" id="add-fav" type="button">${icon('plus')} Hozzáadás</button></div>${fav.length?`<div class="favorites-grid" id="favorite-grid">${fav.map(card).join('')}</div>`:`<section class="module-panel neon-edge"><h3>Még nincsenek kedvenceid</h3><p>Adj hozzá egy modult, vagy nyisd meg néhányszor a kívánt funkciót az ikonsorból.</p><button class="ghost-add" id="empty-add">${icon('plus')} Modul hozzáadása</button></section>`}<p class="hintline">${icon('spark')} A Grapes a gyakran megnyitott modulokat automatikusan is idehelyezi. A kézzel rögzítettek mindig megmaradnak.</p><section class="overview"><div class="mini-head"><h2>Felfedezés</h2><small>További elérhető modulok</small></div><div class="shortcut-list">${modules.filter(m=>!fav.some(f=>f.id===m.id)).slice(0,2).map(m=>`<button class="shortcut neon-edge" data-open="${m.id}" type="button"><span class="card-icon">${icon(m.icon)}</span><span><strong>${m.name}</strong><small>${m.category} · ${m.desc}</small></span><span class="arrow">›</span></button>`).join('')}</div></section><p class="footnote">Interaktív arculati terv. A gyakoriság és a kedvencek itt kizárólag helyi mintaadatokból működnek.</p>`;
$$('#main [data-open]').forEach(e=>e.addEventListener('click',()=>openModule(e.dataset.open)));
$$('#main [data-manage]').forEach(e=>e.addEventListener('click',()=>{e.stopPropagation();openSheet(e.dataset.manage)}));
$$('#main #add-fav,#main #empty-add').forEach(e=>e.addEventListener('click',()=>openSheet()));
}
function renderModule(){const root= rootMenus.find(x=>x.id===active);const content=modules.filter(m=>m.category.toLowerCase()===active);$('#main').innerHTML=`<div class="module-header"><h2>${root?.name||'Modul'}</h2><p>${active==='home'?'Növények és háztartás':active==='health'?'Ételnapló, víz, receptek és statisztika':active==='utility'?'Könyvtár és eszközök':'Pénzügyek és kimutatások'}</p></div><section class="module-panel neon-edge"><h3>${active==='home'?'Otthon':active==='health'?'Egészség':active==='utility'?'Eszközök':'Pénzügyek'}</h3><p>Nyiss meg egy funkciót. A gyakran használtakat később a házikó ikonnál is megtalálod.</p><div class="module-links">${content.map(m=>`<button class="module-link" type="button" data-open="${m.id}">${icon(m.icon)}<strong>${m.name}</strong><small>${m.desc}</small></button>`).join('')}</div></section><section class="module-panel neon-edge"><h3>Gyorselérések</h3><p>A kezdőoldalhoz kézzel is hozzáadhatsz bármelyik modult.</p><button class="ghost-add" type="button" id="add-from-module">${icon('plus')} Kedvenc hozzáadása</button></section>`;
$$('#main [data-open]').forEach(e=>e.addEventListener('click',()=>openModule(e.dataset.open)));
$('#add-from-module').addEventListener('click',()=>openSheet());
}
function renderPage(){if(active==='favorites')renderFavorites();else renderModule()}
function note(text){const el=$('#toast');el.textContent=text;el.hidden=false;clearTimeout(note.timer);note.timer=setTimeout(()=>{el.hidden=true},3200)}
function openModule(id){const mod=modules.find(m=>m.id===id);if(!mod)return;state.usage[id]=(state.usage[id]||0)+1;save();note(`A ${mod.name} modul nyílna meg · ${state.usage[id]} próba-megnyitás`);if(active==='favorites')renderPage();}
function openSheet(id=null){sheetPreviousFocus=document.activeElement;sheetOpen=true;$('#overlay').hidden=false;$('#search').value='';renderChoices();$('#search').focus();if(id){const selected=modules.find(m=>m.id===id);note(`${selected.name}: a listában ki/be kapcsolható a rögzítés.`)}}
function closeSheet(){sheetOpen=false;$('#overlay').hidden=true;sheetPreviousFocus?.focus?.();}
function renderChoices(){const q=$('#search').value.toLocaleLowerCase('hu-HU');const content=modules.filter(m=>(m.name+' '+m.category+' '+m.desc).toLocaleLowerCase('hu-HU').includes(q));$('#choices').innerHTML=content.map(m=>{const pinned=state.pinned.includes(m.id),automatic=mostUsed().some(x=>x.id===m.id),hidden=state.hidden.includes(m.id);return `<button class="choice" type="button" data-toggle="${m.id}" aria-pressed="${pinned}">${icon(m.icon)}<div><strong>${m.name}</strong><small>${m.category}${automatic?' · Automatikusan megjelenik':''}${hidden?' · Automatikus javaslat elrejtve':''}</small></div><span class="state">${pinned?'✓ Rögzítve':'+ Hozzáad'}</span></button>`}).join('')||'<p>Nincs találat.</p>';$$('#choices [data-toggle]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.toggle;if(state.pinned.includes(id)){state.pinned=state.pinned.filter(x=>x!==id);if(!state.hidden.includes(id))state.hidden.push(id)}else{state.pinned.push(id);state.hidden=state.hidden.filter(x=>x!==id)}save();renderChoices();if(active==='favorites')renderPage()}))}
$('#search').addEventListener('input',renderChoices);$('#close-sheet').addEventListener('click',closeSheet);$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});$('#settings').addEventListener('click',()=>note('Grapes-beállítások: a végleges alkalmazás globális beállításai nyílnának meg.'));
openView('favorites');
})();</script></body></html>

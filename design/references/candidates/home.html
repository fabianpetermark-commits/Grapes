<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e14"><title>Grapes – Home | UI reference v1.2</title><style>
/* Grapes Brand v1.1 — module redesign previews. VISUAL SPECIFICATION ONLY, not app runtime CSS. */
:root{color-scheme:dark;--bg:#090e14;--panel:#101821;--raised:#17222e;--line:#243343;--line2:#314654;--text:#f2f7fb;--muted:#94a5b8;--cyan:#3bdcf2;--matte:#77c6d2;--amber:#dbb477;--danger:#f28b8b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);margin:0;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.shell{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.shell.detail{padding-bottom:calc(42px + env(safe-area-inset-bottom))}
.header{min-height:91px;border-bottom:1px solid #243343;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 16px 18px;gap:12px;background:#0b141d}
.header h1{font-size:24px;letter-spacing:-.04em;margin:0;font-weight:790}
.head-icon{border:1px solid #355362;min-width:49px;height:49px;display:grid;place-items:center;border-radius:15px;color:var(--cyan);background:#13222c;font-size:22px}
.head-icon svg{width:22px;height:22px}
.tabs{display:flex;gap:3px;overflow:auto;scrollbar-width:none;padding:11px 13px;background:#0b141d;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{min-width:65px;flex:1;display:grid;justify-items:center;gap:5px;padding:9px 6px 8px;border:1px solid transparent;border-radius:15px;background:transparent;color:var(--muted);font-size:11px;font-weight:650}
.tab i{width:28px;height:28px;display:grid;place-items:center;font-size:23px;font-style:normal}
.tab.is-active{background:#172833;color:var(--cyan);border-color:#375765;box-shadow:inset 0 -2px 0 rgba(59,220,242,.65)}
.main{padding:15px 15px 18px;display:grid;gap:12px}
.sectionTitle{font-size:19px;margin:8px 0 2px;font-weight:730;letter-spacing:-.02em}
.widget{background:var(--panel);border:1px solid #293e4c;border-radius:19px;position:relative;isolation:isolate;padding:16px;overflow:hidden}
.widget::before{content:"";position:absolute;top:-1px;left:17px;width:45%;height:1px;background:linear-gradient(90deg,rgba(59,220,242,.87),rgba(59,220,242,.35) 53%,transparent);box-shadow:0 0 4px rgba(59,220,242,.22);pointer-events:none}
.widget::after{content:"";position:absolute;top:19px;left:-1px;width:1px;height:52px;background:linear-gradient(180deg,rgba(59,220,242,.42),transparent);box-shadow:0 0 3px rgba(59,220,242,.2);pointer-events:none}
.widgetHeader,.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.widgetHeader h2{display:flex;align-items:center;gap:9px;font-size:19px;margin:0;font-weight:750}
.widgetHeader .glyph{color:var(--cyan);font-size:21px}
.link{background:none;border:0;color:var(--cyan);font-size:13px;font-weight:700;padding:10px 0}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.value{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.dim{color:var(--muted);font-size:13px}
.sub{margin:9px 0 14px;color:var(--muted);font-size:13px;line-height:1.55}
.metricGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}
.metric{padding:12px;background:#15232d;border:1px solid #304654;border-radius:13px;min-width:0}
.metric .value{font-size:21px;margin-top:8px}.metric .dim{font-size:11px}
.bar{height:7px;background:#263948;border-radius:30px;overflow:hidden;margin-top:10px}.bar>i{display:block;width:var(--progress,50%);height:100%;background:#77c6d2;border-radius:inherit}
.items{display:grid;gap:0;margin-top:8px}
.item{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #243343;min-height:52px}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}.item strong{font-size:14px}.item p{color:var(--muted);font-size:12px;margin:3px 0 0}
.iconBox{width:45px;height:45px;flex:none;border:1px solid #365563;border-radius:13px;background:#1a303b;display:grid;place-items:center;font-size:21px;color:#8ed8e3}
.pill{border:1px solid #34515c;color:#c9e2ea;background:#172e39;border-radius:13px;padding:11px 14px;font-weight:700;font-size:13px}
.pill.primary{color:#aaf2fa;border-color:#45808b;background:#173845}

input,select,textarea{display:block;width:100%;min-height:45px;border:1px solid #38505e;border-radius:12px;background:#14232d;padding:12px;color:var(--text);font-size:14px;min-width:0}
textarea{resize:vertical}
label{display:grid;gap:7px;font-size:12px;color:var(--muted);font-weight:650}
.form{display:grid;gap:13px}
.row{display:flex;gap:9px;align-items:center}

.action i{font-style:normal;font-size:21px;color:#8fcbd3}
.dockMain{border:1px solid #468995;background:#173843;border-radius:22px;min-width:70px;min-height:65px;color:var(--cyan);font-size:25px}
.empty{border:1px dashed #36505f;background:#101a23;border-radius:13px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
.detailNav{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:6px;background:#14242e;border:1px solid #314754;border-radius:15px}
.detailNav button{flex:1 0 auto;background:none;border:0;padding:10px 13px;border-radius:10px;font-size:12px;color:var(--muted)}
.detailNav button.active{background:#264450;color:#aaf2fa}
.pageSection[hidden],[hidden]{display:none!important}
.note{font-size:11px;color:#758a9c;line-height:1.5;margin:12px 3px}
.qrPreview{display:grid;place-items:center;aspect-ratio:1;max-width:240px;margin:15px auto;background:#fff;border-radius:13px;color:#111;outline:6px solid #192b36;border:12px solid white;font-size:13px;text-align:center}
.qrGraphic{display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(17,1fr);width:180px;height:180px}
.qrGraphic span.on{background:#0b1723}
.cover{width:68px;height:93px;border-radius:7px;background:linear-gradient(135deg,#315c65,#142c3b 65%,#0e1b27);box-shadow:5px 5px 0 #0a1219;border:1px solid #3d6670;flex:none;display:grid;place-items:center;text-align:center;padding:6px;font-size:13px;font-weight:700}
.cardLink{display:block;cursor:pointer}
.status{min-height:21px;color:#8bcfdd;font-size:12px;padding-top:5px}
.back{border:0;background:none;color:var(--cyan);font-size:13px;font-weight:700;padding:9px 1px}
@media(max-width:350px){.tabs{padding-inline:7px}.tab{min-width:61px;font-size:10px}.main{padding-inline:12px}.widget{padding:13px}.dock{padding-inline:10px}.action{font-size:10px}.header h1{font-size:22px}}
@media(min-width:720px){body{background:#060a0e}.shell{border-left:1px solid #243343;border-right:1px solid #243343}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

:root { --rail-bg:#101821; --rail-border:#2a4352; --rail-active:#1b3541; }
.tabs,.detailNav.icon-rail { display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;gap:3px;
 padding:5px;margin:10px 13px 4px;border:1px solid var(--rail-border);

 overflow:visible;min-height:63px }

 font-size:0;line-height:0;box-shadow:none;text-decoration:none;
}

 box-shadow:inset 0 -2px 0 #3bdcf2b0,0 0 5px rgba(59,220,242,.1);
}
.tabs .tab:focus-visible,.detailNav.icon-rail :is(a,button):focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.header .head-icon{display:none!important}
.header{min-height:63px;padding:10px 17px}
.header h1{font-size:22px}
@media(max-width:350px){.tabs,.detailNav.icon-rail{margin-inline:9px;padding:4px;gap:2px;min-height:58px}.tabs .tab,.detailNav.icon-rail :is(button,a){min-height:47px;border-radius:14px}.tabs .tab i svg,.detailNav.icon-rail svg{width:20px;height:20px}}

/* Review parity v1.2: the 6-icon capsule comes before the SINGLE page title. */
.shell:not(.detail){display:flex;flex-direction:column}
.shell:not(.detail) > .tabs{order:0;flex-shrink:0}

.module-view-title{font-size:23px;font-weight:780;letter-spacing:-.035em;line-height:1.2;margin:7px 1px 5px;color:#f2f7fb}

    <button type="button" data-home-scope="own">Saját</button>
    <button type="button" data-home-scope="family" class="active">Közös családi</button>
  </div>
  <div class="h-context" id="h-context" aria-live="polite"></div>
  <nav class="h-sections" role="tablist" aria-label="Home napi műveletei">
    <button type="button" data-home-tab="shopping" class="active" role="tab">Bevásárlás</button>
    <button type="button" data-home-tab="stock" role="tab">Készlet</button>
    <button type="button" data-home-tab="suggestions" role="tab">Javaslatok</button>
  </nav>
  <section class="h-content" id="h-panel" aria-live="polite"></section>
  <details class="h-tools" id="h-more"><summary>Háztartás kezelése és egyéb eszközök</summary><div class="h-tool-content" id="h-tools-content"></div></details>
  <p class="h-status" role="status" aria-live="polite" id="h-status"></p>
  <p class="h-demo-note">Interaktív Grapes v1.2 UI-terv, kizárólag helyben módosítható mintaadatokkal. Nem azonos a jelenlegi v40 felülettel, és nem olvas/ír Grapes-fiókot vagy Supabase-adatot.</p>
</main>
<footer class="dock" aria-label="Home Quick Action"><div class="dockInner"><div class="dockGroup">
<button class="action" type="button" data-home-quick="add-shopping" aria-label="Bevásárlólista-tétel hozzáadása"><i aria-hidden="true">☷</i><span>Lista +</span></button>
<button class="action" type="button" data-home-quick="add-stock" aria-label="Készlettétel hozzáadása"><i aria-hidden="true">▤</i><span>Készlet +</span></button>
<button class="action" type="button" data-home-quick="manage" aria-label="Háztartás kezelése"><i aria-hidden="true">♧</i><span>Háztartás</span></button>
</div><a class="dockMain h-plants-main" href="../approved/plants-widget.html" aria-label="Növények megnyitása" title="Növények"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C9 4 4 10 5 19c9 2 15-3 15-15Z"/><path d="M4 21 17 8"/></svg></a></div></footer>
<dialog class="h-dialog" id="h-dialog" aria-label="Új Home tétel">
  <form method="dialog" id="h-add-form" class="form">
    <h3 id="h-dialog-title">Új tétel</h3>
    <p class="h-quiet" id="h-dialog-hint">A módosítás csak a mintában történik.</p>
    <label>Termék neve<input id="h-input-name" autocomplete="off" maxlength="90" required placeholder="Pl. Kenyér"></label>
    <div class="h-qty-grid"><label>Mennyiség (opcionális)<input id="h-input-qty" type="number" min="0.001" step="any" inputmode="decimal" placeholder="Pl. 1"></label>
    <label>Egység<select id="h-input-unit"><option value="db">db</option><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="csomag">csomag</option></select></label></div>
    <footer><button type="button" class="pill" id="h-cancel">Mégse</button><button type="submit" class="pill primary">Hozzáadás</button></footer>
  </form>
</dialog>
</div>
<script>
(function(){
  'use strict';
  const state={
    scope:'family',tab:'shopping',shoppingList:'heti',sequence:20,pendingStock:null,
    family:{name:'Családi otthon',role:'Tulajdonos',revision:3,
      stock:[{id:'fs1',name:'Tej',qty:2,unit:'l'},{id:'fs2',name:'Liszt',qty:1,unit:'kg'}],
      shopping:[{id:'f1',name:'Tojás',qty:6,unit:'db',done:false},{id:'f2',name:'Tej',qty:2,unit:'l',done:true}]},
    own:{stock:[{id:'os1',name:'Zabpehely',qty:500,unit:'g'},{id:'os2',name:'Só',qty:1,unit:'kg'}],
      lists:[{id:'heti',name:'Heti bevásárlás'},{id:'nagy',name:'Nagybevásárlás'}],
      shopping:[{id:'o1',name:'Paradicsom',qty:4,unit:'db',done:false,listId:'heti'},
                {id:'o2',name:'Olívaolaj',qty:1,unit:'l',done:false,listId:'nagy'}],
      suggestions:[{id:'s1',name:'Élesztő',type:'forecast',cause:'Vásárlási gyakoriság alapján · kb. 5 napon belül',qty:null,unit:'csomag',archived:false,age:1},
                   {id:'s2',name:'Rizs',type:'confirmed',cause:'Igazolt készlethiány',qty:1,unit:'kg',archived:false,age:2}]}
  };
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const txt=(s)=>$('#h-status').textContent=s;
  const amount=item=>item.qty==null?'Mennyiség nincs megadva':String(item.qty).replace('.',',')+' '+item.unit;
  const data=()=>state[state.scope];
  function render(){
    document.querySelectorAll('[data-home-scope]').forEach(el=>{const active=el.dataset.homeScope===state.scope;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});
    document.querySelectorAll('[data-home-tab]').forEach(el=>{const active=el.dataset.homeTab===state.tab;el.classList.toggle('active',active);el.hidden=state.scope==='family'&&el.dataset.homeTab==='suggestions';el.setAttribute('aria-selected',String(active))});
    $('#h-context').innerHTML=state.scope==='family'?
      '<div class="h-context-top"><strong>'+esc(state.family.name)+'</strong><span class="h-chip">KÖZÖS</span></div><p>Megosztva a háztartás tagjaival · '+esc(state.family.role)+'</p>':
      '<div class="h-context-top"><strong>Saját Home</strong><span class="h-chip">PRIVÁT</span></div><p>Csak a te fiókodhoz tartozik; nincs automatikus közös megosztás.</p>';
    const items=data();
    if(state.tab==='shopping')renderShopping(items);
    if(state.tab==='stock')renderStock(items);
    if(state.tab==='suggestions')renderSuggestions(items);
    $('#h-tools-content').innerHTML=state.scope==='family'?
      '<h3>Háztartás kezelése</h3><p>A háztartás létrehozása, meghívás és csatlakozás külön beállítási részben történik – nem a bevásárlás közepén. A mintában a tényleges meghívókód nem generálódik.</p><div class="h-manage-grid"><button type="button" data-home-manage="Új családi háztartás">+ Új háztartás</button><button type="button" data-home-manage="Családtag meghívása">Meghívás / tagok kezelése</button><button type="button" data-home-manage="Csatlakozás kóddal">Csatlakozás meghívókóddal</button></div><p>A kapcsolati állapot és a hibák itt csak szimulációk. Nem történt valódi adatátvitel.</p>':
      '<h3>Saját Home eszközei</h3><div class="h-manage-grid"><button type="button" data-home-manage="Receptek és főzés">Receptek és főzés</button><button type="button" data-home-manage="Blokkok">Blokkok feldolgozása</button></div><p>A megvett tétel csak ellenőrzött mennyiséggel növeli a készletet.</p>';
  }
  function renderShopping(items){
    const own=state.scope==='own';
    const subset=items.shopping.filter(x=>!own||x.listId===state.shoppingList);
    const pending=subset.filter(x=>!x.done),done=subset.filter(x=>x.done);
    const awaitingReceipt=state.pendingStock?.scope===state.scope?items.shopping.find(x=>x.id===state.pendingStock.id&&x.done):null;
    const listings=own?'<label class="h-quiet">Bevásárlólista<select class="h-list-select" id="h-select-list" aria-label="Bevásárlólista">'+items.lists.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===state.shoppingList?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>':'';
    const row=(x)=>'<label class="h-product'+(x.done?' done':'')+'"><input data-check type="checkbox" data-id="'+esc(x.id)+'"'+(x.done?' checked':'')+'><span><strong>'+esc(x.name)+'</strong><small>'+esc(amount(x))+(x.done?' · Megvásárolva':' · Listán')+'</small></span></label>';
    $('#h-panel').innerHTML='<section class="h-card"><div class="h-card-top"><h3>'+ (own?'Saját bevásárlás':'Közös bevásárlás') +'</h3><button class="h-action primary" type="button" data-home-add="shopping">+ Tétel</button></div>'+listings+
      '<div class="h-products" data-home-open-items>'+(pending.length?pending.map(row).join(''):'<p class="h-empty">Nincs vásárolnivaló ezen a listán.</p>')+'</div>'+
      (done.length?'<details class="h-details" id="h-completed"><summary>Megvett tételek ('+done.length+')</summary><div>'+done.map(row).join('')+'</div></details>':'')+
      (awaitingReceipt?'<div class="h-stock-confirm" id="h-stock-confirm" role="group" aria-label="Készletbevétel megerősítése"><strong>'+esc(awaitingReceipt.name)+' · Megvásárolva</strong><p>A kipipálás csak a bevásárlólistán jelöli késznek. A készletet kizárólag külön jóváhagyással növeljük'+(awaitingReceipt.qty==null?', az ismert mennyiség hiányában a készletbe nem vehető át.':': '+esc(amount(awaitingReceipt))+'.')+'</p><div class="h-inline"><button type="button" class="h-action primary" data-home-receive="confirm"'+(awaitingReceipt.qty==null?' disabled':'')+'>Készletbe vétele</button><button type="button" class="h-action" data-home-receive="skip">Most nem</button></div></div>':'')+'</section>';
  }
  function renderStock(items){
    $('#h-panel').innerHTML='<section class="h-card"><div class="h-card-top"><h3>'+(state.scope==='own'?'Saját készlet':'Közös készlet')+'</h3><button class="h-action primary" type="button" data-home-add="stock">+ Készlet</button></div><p class="h-quiet">A készlet és a bevásárlólista külön adat. A készlet csak ténylegesen rögzített mennyiségből változik.</p><div>'+
      (items.stock.length?items.stock.map(x=>'<div class="h-stock-row"><span class="h-icon-mini" aria-hidden="true">▣</span><div><strong>'+esc(x.name)+'</strong></div><span>'+esc(amount(x))+'</span></div>').join(''):'<div class="h-empty">A készlet még üres.</div>')+'</div></section>';
  }
  function renderSuggestions(items){
    const active=items.suggestions.filter(x=>!x.archived),archived=items.suggestions.filter(x=>x.archived);
    const suggestion=x=>'<div class="h-product"><label class="h-pick" style="flex:1"><input type="checkbox" data-home-pick="'+esc(x.id)+'"><span><strong>'+esc(x.name)+'</strong><small>'+esc(x.cause)+'</small>'+ (x.type==='forecast'?'<small><em class="h-badge-estimate">BECSLÉS · nem biztos hiány</em></small>':'<small>Igazolt · '+esc(amount(x))+'</small>')+'</span></label><button type="button" class="h-x" data-home-dismiss="'+esc(x.id)+'" aria-label="'+esc(x.name)+' elvetése" title="Most nem">×</button></div>';
    $('#h-panel').innerHTML='<section class="h-card"><div class="h-card-top"><h3>Automatikus javaslatok</h3><span class="h-chip">NEM BEVÁSÁRLÓLISTA</span></div><p class="h-quiet">Igazolt hiány és becsült újravásárlás külön megjelölve. Csak te döntöd el, mi kerüljön át a bevásárlólistára.</p>'+
      (active.length?active.map(suggestion).join(''):'<p class="h-empty">Nincs aktuális javaslat.</p>')+
      '<button class="h-action primary" type="button" id="h-move">Kijelöltek listára</button><details class="h-details" id="h-archive"><summary>Korábbi javaslatok ('+archived.length+')</summary>'+ (archived.length?archived.map(x=>'<div class="h-product"><span><strong>'+esc(x.name)+'</strong><small>Elvetve vagy automatikusan archiválva</small></span><button class="h-action" type="button" data-home-restore="'+esc(x.id)+'">Visszaállítás</button></div>').join(''):'<p class="h-quiet">Nincs korábbi javaslat.</p>')+'</details></section>';
  }
  function openForm(kind){
    $('#h-add-form').dataset.kind=kind;
    $('#h-add-form').reset();
    $('#h-dialog-title').textContent=kind==='stock'?'Készlet rögzítése':'Új bevásárlólista-tétel';
    $('#h-dialog-hint').textContent='Ez csak interaktív minta. Nem módosít fiókot vagy valódi készletet.';
    $('#h-input-name').required=true;
    $('#h-dialog').showModal();
    $('#h-input-name').focus();
  }
  document.addEventListener('click',event=>{
    const node=event.target.closest('button');
    if(!node)return;
    if(node.dataset.homeScope){
      state.scope=node.dataset.homeScope;state.pendingStock=null;if(state.scope==='family'&&state.tab==='suggestions')state.tab='shopping';render();txt(state.scope==='family'?'Közös háztartás mintanézet.':'Saját készlet mintanézet.');return;
    }
    if(node.dataset.homeTab){state.tab=node.dataset.homeTab;render();return}
    if(node.dataset.homeReceive){
      const pending=state.pendingStock;
      if(node.dataset.homeReceive==='confirm'&&pending&&pending.scope===state.scope){
        const item=data().shopping.find(row=>row.id===pending.id&&row.done);
        if(!item||item.qty==null||!Number.isFinite(item.qty)||item.qty<=0){txt('Csak ellenőrzött, pozitív mennyiség vehető készletbe.');return}
        if(!data().stock.some(row=>row.sourceShoppingId===item.id)){
          data().stock.push({id:'from-'+item.id,sourceShoppingId:item.id,name:item.name,qty:item.qty,unit:item.unit});
        }
        txt(item.name+' megerősítve, külön művelettel a '+(state.scope==='family'?'közös':'saját')+' készletbe került.');
      }else txt('A tétel megvásárolva maradt, a készlet változatlan.');
      state.pendingStock=null;render();return;
    }
    if(node.dataset.homeQuick){const action=node.dataset.homeQuick;if(action==='add-shopping'||action==='add-stock'){openForm(action==='add-stock'?'stock':'shopping');return}if(action==='manage'){const el=$('#h-more');el.open=true;el.scrollIntoView({behavior:'smooth',block:'center'});return}}
    if(node.dataset.homeAdd){openForm(node.dataset.homeAdd);return}
    if(node.dataset.homeManage){txt(node.dataset.homeManage+' – a valódi családi kezelő továbbra is a működő TEST-alkalmazás feladata.');return}
    if(node.dataset.homeDismiss){const x=state.own.suggestions.find(row=>row.id===node.dataset.homeDismiss);if(x){x.archived=true;render();txt(x.name+' elvetve. Ugyanez a hiányciklus nem jelenne meg újra.')}return}
    if(node.dataset.homeRestore){const x=state.own.suggestions.find(row=>row.id===node.dataset.homeRestore);if(x){x.archived=false;render();txt(x.name+' újra megjelenik a javaslatok között.')}return}
    if(node.id==='h-move'){
      const selected=[...document.querySelectorAll('[data-home-pick]:checked')].map(x=>x.dataset.homePick);
      if(!selected.length){txt('Jelölj ki előbb legalább egy javaslatot.');return}
      selected.forEach(id=>{
        const x=state.own.suggestions.find(row=>row.id===id);
        if(x&&!state.own.shopping.some(a=>a.name===x.name&&!a.done))state.own.shopping.push({id:'o'+(++state.sequence),name:x.name,qty:x.qty,unit:x.unit,done:false,listId:state.shoppingList});
        if(x)x.archived=true;
      });
      state.tab='shopping';render();txt('Kijelölt javaslat(ok) külön döntéssel a saját bevásárlólistára kerültek.');return;
    }
    if(node.id==='h-cancel')$('#h-dialog').close();
    if(node.dataset.settings!==undefined){$('#h-more').open=true;$('#h-more').scrollIntoView({behavior:'smooth',block:'start'});$('#h-more summary').focus();txt('A háztartáskezelő eszközök megnyitva a mintában.');return}
  });
  document.addEventListener('change',event=>{
    if(event.target.matches('#h-select-list')){state.shoppingList=event.target.value;render();return}
    if(event.target.matches('[data-check]')){
      const x=data().shopping.find(item=>item.id===event.target.dataset.id);
      if(!x)return;x.done=event.target.checked;
      // IMPORTANT: shopping completion is NOT a stock-receipt event.
      // Previously received stock remains independent when shopping is unchecked.
      state.pendingStock=x.done?{scope:state.scope,id:x.id}:null;
      const keepDoneOpen=Boolean($('#h-completed')?.open);
      render(); if(keepDoneOpen&&$('#h-completed'))$('#h-completed').open=true;
      txt(x.done?'Megvásárolva jelölve. Készletátvételhez külön megerősítés szükséges.':'A vásárlásjelölés visszavonva, a készlet változatlan.');
    }
  });
  $('#h-add-form').addEventListener('submit',event=>{
    event.preventDefault();
    const name=$('#h-input-name').value.trim();
    const value=$('#h-input-qty').value;
    if(!name)return;
    const qty=value===''?null:Number(value);
    if(qty!==null&&(!Number.isFinite(qty)||qty<=0))return;
    const unit=$('#h-input-unit').value, id='new'+(++state.sequence);
    if(event.currentTarget.dataset.kind==='stock'){if(qty==null){txt('Készlet csak ismert mennyiséggel rögzíthető.');return}data().stock.push({id,name,qty,unit})}
    else data().shopping.push({id,name,qty,unit,done:false,...(state.scope==='own'?{listId:state.shoppingList}:{})});
    $('#h-dialog').close();render();txt('Mintaelem rögzítve – nincs valódi adatmentés.');
  });
  render();
})();
</script></body></html>
